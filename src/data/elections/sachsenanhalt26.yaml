title: Landtagswahl Sachsen-Anhalt
slug: sachsenanhalt26
date: '2026-09-06'
archived: false
questions:
  - id: question-0
    index: 0
    category: Demokratie & Institutionen
    thesis: Sachsen-Anhalt sollte alle Rundfunkstaatsverträge im Alleingang kündigen.
    answers:
      - party: cdu-csu
        answer: zu weit
        comment: >-
          Die CDU lehnt den [Antrag der
          AfD-Fraktion](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6332aan.pdf)
          ab und steht zu dem Grundmodell des öffentlichrechtlichen Rundfunks.
          Es müsse eine [unabhängige, neutrale, ausgewogene
          Berichterstattung](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/103stzg.pdf#page=42)
          geben, auf der Grundlage von einheitlichen journalistischen
          Qualitätsstandards.
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD lehnt den [Antrag der
          AfD](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6332aan.pdf)
          ab und hebt (in der
          Plenardebatte)(https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/103stzg.pdf#page=34)
          hervor, dass ihnen "unabhängiger Journalismus, Vielfalt und
          demokratische Kontrolle" wichtig sei – im Gegensatz zum Antrag der
          AfD.
      - party: die-linke
        answer: zu weit
        comment: >-
          Die Linke[lehnt den
          Antrag](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6332aan.pdf)
          ab, weil "er offenbart ein klares Konzept für einen Einstieg in die
          [Zerstörung wesentlicher Elemente unseres föderalen
          Systems](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/103stzg.pdf#page=36)
          und unserer demokratischen Grundordnung" sei. Die Enquete-Kommission
          solle sich um Reformen kümmern, aber [keine einseitige
          Kündigung](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/103stzg.pdf#page=37). 
      - party: afd
        answer: richtig
        comment: >-
          Die AfD stimmt ihrem eigenen Antrag zu und sieht den
          Rundfunkstaatsvertrag als
          "[Rundfunkszwangsabgabe](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/103stzg.pdf#page=23)",
          die weg müsse. Aus ihrer Sicht sollte "[niemand soll gezwungen
          sein](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/103stzg.pdf#page=24),
          für etwas zu bezahlen, was er nicht sehen, was er nicht konsumieren
          möchte."
      - party: fdp
        answer: zu weit
        comment: >-
          Die FDP lehnt den [Antrag der
          AfD](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6332aan.pdf)
          ab und hält den "öffentlich-rechtlichen Rundfunk [...] für [notwendig,
          um die Ziele aus dem Grundgesetz
          umzusetzen](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/103stzg.pdf#page=38):
          Informationen und Bildung unabhängig, neutral, objektiv zu
          gewährleisten". Aus ihrer Sicht müsse er nur reformiert werden. 
  - id: question-1
    index: 1
    category: Strukturwandel
    thesis: >-
      Um Gelder der Jugendarbeit fairer zwischen Stadt und Land zu verteilen,
      soll Sachsen-Anhalt dabei neben der Anzahl der Jugendlichen auch die
      Fläche des Landkreises bzw. der Städte berücksichtigen.
    answers:
      - party: cdu-csu
        answer: richtig
        comment: >-
          Die CDU stimmt [ihrem eigenen
          Antrag](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d1710ran.pdf)
          zu mit der Begründung, dass "Stadt und Land [...] [weiterhin gleich
          gefördert](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/028stzg.pdf#page=93)
          werden [sollten]." 
      - party: spd
        answer: richtig
        comment: >-
          Die SPD stimmt dem Antrag der Regierungskoalition zu, da der
          [Flächenfaktor die unterschiedlichen Bedingungen der
          Jugendarbeit](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/028stzg.pdf#page=98)
          in Stadt und Land berücksichtigen werde.
      - party: die-linke
        answer: /
        comment: >-
          Die Linke enthält sich bei der Abstimmung [zum
          Antrag](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d1710ran.pdf).
          Die Fraktion hat einen Alternativantrag eingebracht und betont in der
          [Debatte](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/028stzg.pdf#page=94):
          "Daher brauchen wir nicht nur einen Flächenfaktor. Die Jugendarbeit
          vor Ort braucht dringend eine deutliche Verbesserung der Fördersumme."
      - party: die-gr-nen
        answer: richtig
        comment: >-
          Die Grünen unterstützen den [Antrag der
          Koalitionsfraktionen](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d1710ran.pdf)
          und betonen den Landesverfassungsgrundsatz der "[Gleichwertigkeit der
          Lebensverhältnisse in Stadt und
          Land](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/028stzg.pdf#page=99)". 
      - party: afd
        answer: /
        comment: >-
          Die AfD enthielt sich bei der Abstimmung [zum
          Antrag](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d1710ran.pdf),
          da die Forderungen laut
          [Debatte](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/028stzg.pdf#page=92)
          in der Petition des Kinder- und Jugendrings in einem Ausschuss
          verhandelt werden sollten.  
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP stimmt [ihrem eigenen
          Antrag](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d1710ran.pdf)
          zu und betont, dass es Ziel der Koalitionsfraktionen sei, mit diesem
          Antrag [die Jugendarbeit zu
          stärken](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/028stzg.pdf#page=87)
          und "[das Gefälle zwischen Kommunen auf dem Land und den kreisfreien
          Städten](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/028stzg.pdf#page=88)
          etwas abzuflachen". 
  - id: question-2
    index: 2
    category: Demokratie & Institutionen
    thesis: >-
      Der Fortbestand der Landeszentrale für politische Bildung soll gesetzlich
      abgesichert werden.
    answers: []
  - id: question-3
    index: 3
    category: Migration
    thesis: >-
      Die Landesregierung sollte sich beim Bund dafür einzusetzen, dass syrische
      Staatsangehörige mit einer Aufenthaltserlaubnis sicher nach Syrien reisen
      können, ohne ihr Aufenthaltsrecht in Deutschland zu gefährden.
    answers:
      - party: cdu-csu
        answer: zu weit
        comment: >-
          Die CDU lehnt den [Antrag der
          Grünen](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d5352gaa.pdf)
          ab. Sie gehen nicht direkt auf die Forderung der Grünen ein, betonen
          aber: "[Wenn der Fluchtgrund weggefallen
          ist](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/087stzg.pdf#page=48),
          dann müssen insbesondere diejenigen unser Land wieder verlassen, die
          ihren Lebensunterhalt nicht selbst bestreiten, die sich nicht
          integriert haben und die nur auf Staatskosten leben."
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD lehnt den [Antrag der
          Grünen](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d5352gaa.pdf)
          ab, geht in ihrer Rede aber nicht auf die Forderung ein, sondern
          stellt sich inhaltlich den Forderungen der AfD entgegen: Die
          Syrer*innen seien [ein wichtiger
          Teil](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/087stzg.pdf#page=41)
          Deutschlands.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Linke stimmt dem [Antrag der
          Grünen](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d5352gaa.pdf)
          zu. Syrien sei nicht sicher, eine Rückführung sei lebensgefährlich und
          völkerrechtlich höchst problematisch. Zudem tragen [viele syrische
          Geflüchtete aktiv zur deutschen Gesellschaft
          bei](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/087stzg.pdf#page=43),
          in Krankenhäusern, in Forschung, im Handwerk und beim Ehrenamt.
      - party: die-gr-nen
        answer: richtig
        comment: >-
          Die Grünen stimmen [dem eigenen
          Antrag](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d5352gaa.pdf)
          zu. "Wir müssen uns also darum kümmern, dass alle Menschen, die aus
          Syrien kommen und sich am Aufbau eines demokratischen Staates
          beteiligen wollen, die Möglichkeit erhalten, [aus der Sicherheit
          Deutschlands heraus einen Beitrag zu
          leisten](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/087stzg.pdf#page=48)."
          Dafür brauche es eine Bundesratsinitiative.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD lehnt den [Antrag der
          Grünen](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d5352gaa.pdf)
          ab und betont, dass Syrer*innen [nach ihrer
          Aussage](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/087stzg.pdf#page=33)
          kein gutes Haar an Deutschland lassen und Land und Volk schlechtmachen
          würden. 
      - party: fdp
        answer: zu weit
        comment: >-
          Die FDP lehnt den [Antrag der
          Grünen](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d5352gaa.pdf)
          ab. Ein temporärer Schutz seie eben ein temporärer Schutz und wenn die
          Gründe für den Schutz entfallen, dann werde es die [Aufforderung geben
          müssen](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/087stzg.pdf#page=45),
          das Land zu verlassen.
  - id: question-4
    index: 4
    category: Energie & Klima
    thesis: >-
      Das bisherige Verbot von Windenergieanlagen in Wäldern soll aufgehoben
      werden. 
    answers:
      - party: cdu-csu
        answer: richtig
        comment: >-
          Die CDU stimmt [dem
          Gesetzentwurf](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d3708lge.pdf)
          zu. Für die CDUsei klar: Als Rechtsstaatspartei setze man natürlich
          Verfassungsrecht um, auch wenn das manchmal wehe. Das Flächenziel
          [müsse leider erreicht
          werden](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/068stzg.pdf#page=107).
      - party: spd
        answer: richtig
        comment: >-
          Die SPD stimmt dem Antrag zu. Es [brauche eine weitere Ausweitung von
          Windeignungsgebieten](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/068stzg.pdf#page=102).
          Zudem sei der Beschluss eineUmsetzung eines
          Bundesverfassungsgerichtsurteils. 
      - party: die-linke
        answer: /
        comment: >-
          Die Linke hat sich bei der Abstimmung [zum
          Landeswaldschutzgesetz](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d3708lge.pdf)
          enthalten, da aus ihrer Sicht an [Klarstellungen
          fehle](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/068stzg.pdf#page=104),
          um das

          Unterlaufen des Natur-, Arten- und Umweltschutzes zu unterbinden.
      - party: die-gr-nen
        answer: /
        comment: >-
          Die Grünen haben sich bei der [Abstimmung zum
          Gesetzentwurf](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d3708lge.pdf)
          enthalten, da die Aufhebung des Verbots [flankierende Maßnahmen und
          Vorgaben
          erfordere](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/068stzg.pdf#page=106),
          damit Windanlagen nur in Ausnahmefällen und nur auf
          naturschutzfachlich nicht wertvollen Flächenmöglich wären.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD lehnt [den
          Gesetzentwurf](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d3708lge.pdf)
          ab. Die Partei hatte einen
          [Änderungsantrag](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d4267aae.pdf)
          eingebracht mit dem "[kein einziges Windrad im Wald entstehen
          würde](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/068stzg.pdf#page=101);
          denn uns ist der Wald als Naturgebiet wichtig und nicht als
          Energieerzeugungsgebiet"
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP stimmt [dem
          Gesetzentwurf](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d3708lge.pdf)
          zu und betont in der Plenardebatte, dass "was als verfassungswidrig
          eingestuft wird, das muss

          weg, in diesem Fall eben das [absolute Verbot der Windenergienutzung
          im
          Wald](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/068stzg.pdf#page=104)."
  - id: question-5
    index: 5
    category: Justiz
    thesis: >-
      Sachsen-Anhalt sollte sich auf Bundesebene dafür einsetzen, dass Fahren
      ohne Fahrschein keine Straftat mehr sein soll.
    answers:
      - party: cdu-csu
        answer: zu weit
        comment: >-
          Die CDU lehnt den [Antrag der
          Grünen](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6851gan.pdf)
          ab und stellte einen eigenen [Alternativantrag zu Sicherheit im
          Öffentlichen
          Personennahverkehr](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6890raa.pdf),
          in dem die Forderung nicht mehr vorkommt. In ihrer Rede geht sie nicht
          auf die Thematik ein. 
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD stimmt gegen den [Antrag der
          Grünen](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6851gan.pdf)
          und für ihren eigenen
          [Alternativantrag](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6890raa.pdf),
          der das Thema nicht mehr aufgreift. Zum Thema der These äußern sie
          sich in ihrer Rede nicht. Sie betonen dennoch: "Wir wollen, dass die
          Menschen die Freiheit haben, ihr Verkehrsmittel nach [ihren
          Bedürfnissen und auch nach ihrer sozialen
          Lage](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf#page=104)
          auszuwählen."
      - party: die-linke
        answer: richtig
        comment: >-
          Die Linke stimmt dem [Antrag der
          Grünen](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6851gan.pdf)
          zu, geht in ihrer Rede aber nicht direkt auf die Forderung ein. 
      - party: die-gr-nen
        answer: richtig
        comment: >-
          Die Grünen stimmen ihrem [eigenen
          Antrag](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6851gan.pdf)
          zu und fordern in der Debatte "[sowohl einen Verzicht auf die
          Ausweiskontrolle als auch auf die Strafbarkeit des Fahrens ohne
          Fahrschein](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf)."
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD lehnt den [Antrag der
          Grünen](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6851gan.pdf)
          ab. Fahren ohne Fahrschein sei kein Bagatelldelikt mit geringer
          krimineller Energie, sondern "[asoziales
          Verhalten](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf#page=108)",
          das nichts mit Armut zu tun habe. 
      - party: fdp
        answer: zu weit
        comment: >-
          Die FDP lehnt den [Antrag der
          Grünen](https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6851gan.pdf)
          ab. Es könne keine Lösung sein, Schwarzfahren zum Kavaliersdelikt zu
          machen. "[Diejenigen, die ihre Fahrkarte bezahlen, wären dann die
          Dummen. Das käme letztlich einer Bankrotterklärung des Staates
          gleich](https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf#page=114)." 
