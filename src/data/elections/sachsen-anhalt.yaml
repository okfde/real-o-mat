          finanzierten Umsetzung und ersten Verbesserungen bereits zum
          Wintersemester 2026/27 trug sie nicht mit.
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7079dan.pdf">Antrag</a>
          der Linken ab und stimmte entsprechend der Koalitionslogik dem
          Alternativantrag der Koalitionsfraktionen zu. Ihre Rede liefert jedoch
          keine inhaltliche Begründung dafür, warum ihr die Forderung der Linken
          zu weit ging. Im Gegenteil: Sie forderte die <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/115stzg.pdf#page=165">Bundesregierung
          zum Handeln auf</a>, verwies selbst auf erste Verbesserungen zum
          Wintersemester 2026/27 und verlangte die schrittweise Umsetzung der im
