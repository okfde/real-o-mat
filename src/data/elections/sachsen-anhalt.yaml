      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Grünen stimmten dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7079dan.pdf">Antrag</a>
          der Linken zu. Sie forderten ebenfalls, dass die Bundesregierung ihre
          Zusagen einhält und die BAföG-Reform nicht weiter verschiebt. Aus
          ihrer Sicht müsse die <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/115stzg.pdf#page=187">Reform
          über kleinere technische Korrekturen hinausgehen</a> und höhere,
          stärker an den tatsächlichen Lebenshaltungskosten orientierte
          Leistungen vorsehen.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD enthielt sich sowohl beim <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7079dan.pdf">Antrag</a>
          der Linken als auch beim Alternativantrag der Landeskoalition. Eine
          stärkere Förderung und eine Vergrößerung des Kreises von
          BAföG-Berechtigten sei zwar grundsätzlich notwendig, dabei solle das
          BAföG jedoch an <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/115stzg.pdf#page=170">Studienleistungen
          gekoppelt</a> und nicht gleichermaßen an alle Berechtigten verteilt
          werden.
      - party: fdp
        answer: zu weit
        comment: >-
          Die FDP lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7079dan.pdf">Antrag</a>
          der Linken ab und stimmte dem weniger verbindlichen Koalitionsantrag
          zu. Man solle den Schwerpunkt zunächst darauf legen, dass <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/115stzg.pdf#page=181">bereits
          anspruchsberechtigte Studierende ihre Förderung tatsächlich
          beantragen</a> und die Verfahren einfacher und unbürokratischer
          werden.
  - id: question-11
    index: 11
    category: Migration
    thesis: >-
      Die Landesregierung soll sich dafür einsetzen, dass syrische
      Staatsangehörige mit einer Aufenthaltserlaubnis nach Syrien reisen können,
      ohne dadurch ihr Aufenthaltsrecht in Deutschland zu gefährden.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
      Recherchen, Klagen und Community-Aktionen. Lies jetzt diese spannende <a
      target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/artikel/exklusiv/2026/08/rechtsbruch-mit-ansage/">Recherche
      zur deutschen Migrationspolitik</a>! </p>
    keyword: Aufenthaltsrecht
    answers:
      - party: cdu
        answer: zu weit
        comment: >-
          Die CDU lehnt den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d5352gaa.pdf">Antrag
          der Grünen</a> ab und betont, dass das Asylrecht ein <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/087stzg.pdf#page=49">Recht
          auf Zeit</a> sei. Wenn der Fluchtgrund wegfalle, müssten insbesondere
          diejenigen Deutschland verlassen, die ihren Lebensunterhalt nicht
          selbst bestreiten, die sich nicht integriert haben und die nur auf
          Staatskosten leben.
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d5352gaa.pdf">Antrag</a>
          der Grünen ab. In ihrer Rede ging sie auf die konkrete Forderung nach
          Reisen ohne Gefährdung des Aufenthaltsrechts jedoch nicht näher ein.
          Sie <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/087stzg.pdf#page=41">betonte
          vor allem</a>, dass Syrien weiterhin instabil sei, viele syrische
          Geflüchtete inzwischen zu Sachsen-Anhalt gehörten und Menschen, die
          sich am Wiederaufbau Syriens beteiligen wollten, unterstützt werden
          sollten, stimmte aber dennoch innerhalb ihrer Koalitionslogik gegen
          den Antrag.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Linke stimmt dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d5352gaa.pdf">Antrag
          der Grünen</a> zu. Syrien sei nicht sicher, eine Rückführung sei
          lebensgefährlich und völkerrechtlich höchst problematisch. Zudem
          tragen <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/087stzg.pdf#page=43">viele
          syrische Geflüchtete aktiv zur deutschen Gesellschaft bei</a>, in
          Krankenhäusern, in Forschung, im Handwerk und beim Ehrenamt.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Grünen stimmen <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d5352gaa.pdf">dem
          eigenen Antrag</a> zu. Die Lage in Syrien sei weiterhin unsicher und
          viele Geflüchtete müssten zunächst prüfen, ob ihre Häuser noch
          bewohnbar und eine dauerhafte Rückkehr überhaupt möglich seien. <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/087stzg.pdf#page=48">Reisen
          sollten deshalb möglich sein</a>, ohne automatisch den
          Aufenthaltstitel zu gefährden, damit syrische Staatsangehörige aus der
          Sicherheit Deutschlands heraus am demokratischen Wiederaufbau ihres
          Landes mitwirken könnten.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD lehnt den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d5352gaa.pdf">Antrag
          der Grünen</a> ab. Es sei widersprüchlich, Menschen weiterhin einen
          Schutzstatus zu gewähren, wenn sie freiwillig in das Land reisen
          könnten, vor dem sie Schutz beanspruchten. Die vorgeschlagene Regelung
          würde den zeitlich begrenzten Charakter des Aufenthaltsrechts <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/087stzg.pdf#page=33">für
          permanente Einwanderung missbrauchen</a> und Reisen nach Syrien
          ermöglichen, ohne die Schutzbedürftigkeit zu überprüfen.
      - party: fdp
        answer: zu weit
        comment: >-
          Die FDP lehnt den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d5352gaa.pdf">Antrag
          der Grünen</a> ab. Zwar rechtfertige die Sicherheitslage in Syrien
          noch keine pauschale Beendigung des Schutzstatus, jedoch sei der
          Schutzstatus eben nur temporär. <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/087stzg.pdf#page=45">Wer
          freiwillig in sein Herkunftsland reisen könne</a>, müsse zumindest
          überprüfen lassen, ob die Voraussetzungen für den Schutz und den
          Aufenthaltstitel in Deutschland weiterhin bestehen.
  - id: question-12
    index: 12
    category: Demokratie & Institutionen
    thesis: >-
      Wenn die notwendige Zweidrittelmehrheit innerhalb von sechs Monaten nicht
      zustande kommt, sollen Verfassungsrichter*innen auf Vorschlag des
      Landesverfassungsgerichts auch mit absoluter Mehrheit gewählt werden
      können.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
      Recherchen, Klagen und Community-Aktionen. Entdecke, wie wir mit
      strategischen Klagen für <a target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/klagen/">Transparenz und Pressefreiheit
      kämpfen</a>!</p>
    keyword: Verfassungsgericht
    answers:
      - party: cdu
        answer: richtig
        comment: >-
          Die CDU stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6653wge.pdf">Gesetzentwurf</a>
          zu. Die Regelung sei ein <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf#page=9">Schutz
          vor Blockaden und Handlungsunfähigkeit</a>; man wolle sicherstellen,
          dass das Landesverfassungsgericht seine Aufgabe dauerhaft erfüllen
          kann. Ein arbeitsfähiges Gericht stärke die Gewaltenteilung,
          verhindere Machtmissbrauch und sichere die Kontrolle staatlichen
          Handelns.
      - party: spd
        answer: richtig
        comment: >-
          Die SPD stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6653wge.pdf">Gesetzentwurf</a>
          zu. Es müsse verhindert werden, dass <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf#page=14">demokratische
          Institutionen durch gezielte Blockaden</a> handlungsunfähig werden.
          Die Möglichkeit einer Wahl mit absoluter Mehrheit nach einem
          gescheiterten sechsmonatigen Einigungsversuch solle deshalb die
          dauerhafte Arbeitsfähigkeit des Landesverfassungsgerichts sichern.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Linke stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6653wge.pdf">Gesetzentwurf</a>
          zu. Das Landesverfassungsgericht sei ein <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/109stzg.pdf#page=16">zentraler
          Schutz für Grund- und Freiheitsrechte</a> und eine Kontrollinstanz
          gegenüber staatlicher Willkür. Die neue Wahlregel solle verhindern,
          dass eine politische Blockade die Arbeitsfähigkeit des Gerichts und
          damit die unabhängige Justiz gefährdet.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Grünen stimmten der <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6653wge.pdf">Neuregelung</a>
          zu. Eine jahrelange Blockade bei der Besetzung von Richterstellen
          könne die <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf#page=17">Verfassungsgerichtsbarkeit
          und damit auch die Kontrolle der Landesregierung</a> gefährden. Die
          Ersatzregelung mit absoluter Mehrheit solle deshalb gewährleisten,
          dass das Gericht dauerhaft arbeitsfähig bleibt.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6653wge.pdf">Gesetzentwurf</a>
          ab, denn mit ihm wolle man eine mögliche <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf#page=7">Sperrminorität
          umgehen</a>, um Verfassungsrichter*innen künftig ohne Zustimmung der
          AfD wählen zu können. Generell lehne man „<a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf#page=9">politische
          Richter mit Parteibüchern in Verfassungsgerichten</a>“ ab.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP stimmte der <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6653wge.pdf">Neuregelung</a>
          zu. Es müsse zwar weiterhin eine breite Zweidrittelmehrheit gesucht
          werden, es sei jedoch notwendig, für den Fall einer dauerhaften
          Blockade vorzusorgen. Da Verfassungsrichter*innen die Verfassung und
          auch die Rechte von Minderheiten schützen, dürfe ihre <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf#page=19">Wahl
          nicht über Jahre scheitern</a> und dadurch die Arbeitsfähigkeit des
          Gerichts gefährden.
  - id: question-13
    index: 13
    category: Verkehr & Infrastruktur
    thesis: >-
      Auch für reimportierte Simson-Mopeds bis Baujahr 1992 soll die
      Sonderregelung des Einigungsvertrags gelten. Sie sollen 60 km/h fahren
      dürfen, auch wenn für Kleinkrafträder niedrigere Höchstgeschwindigkeiten
      gelten.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern setzt sich mit
      investigativen Recherchen, Klagen und Community-Aktionen für mehr
      Transparenz ein. Du möchtest selbst spannende Informationen über
      Politiker*innen und Behörden ans Licht bringen? Stelle jetzt eine <a
      target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/informationsfreiheit/einsteiger-guide/">IFG-Anfrage</a>!</p>
    keyword: Simson-Mopeds
    answers:
      - party: cdu
        answer: richtig
        comment: >-
          Die CDU stimmte dem gemeinsamen <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6089ran.pdf">Antrag</a>
          der Koalitionsfraktionen zu. Sie hob die Simson als <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/101stzg.pdf#page=147">bezahlbares
          Verkehrsmittel und als ostdeutsches Kulturgut</a> hervor, das bis
          heute mehrere Generationen miteinander verbinde. Vor allem hielt sie
          es für ungerecht, baugleiche Reimporte rechtlich anders zu behandeln.
      - party: spd
        answer: richtig
        comment: >-
          Die SPD stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6089ran.pdf">Antrag</a>
          zu. Die <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/101stzg.pdf#page=155">Simson
          sei eine robuste und bezahlbare Form der Mobilität</a>, insbesondere
          in Regionen mit wenigen Alternativen. Dass baugleiche Reimporte anders
          behandelt würden als Fahrzeuge, die Deutschland nie verlassen hatten,
          sei nicht nachvollziehbar; zugleich unterstützte die Fraktion
          einfachere Zulassungen von Elektro-Umbauten.
      - party: die-linke
        answer: nicht weit genug
        comment: >-
          Die Linke teilte zwar die grundsätzlichen Ziele, enthielt sich aber
          bei der Abstimmung zum <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6089ran.pdf">Antrag</a>
          der Koalitionsfraktionen. Sie legte einen weitergehenden
          Alternativantrag vor. Statt lediglich einzelne nationale
          Zulassungsprobleme zu prüfen, wollte sie eine <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/101stzg.pdf#page=154">unbefristete
          europaweite Anerkennung und Ausnahmeregelung für verkehrssichere
          Simson-Kleinkrafträder</a> bis Baujahr 1992 erreichen. Außerdem sollte
          sich das Land beim Bund für eine Verlängerung auslaufender
          Übergangsregelungen einsetzen.
      - party: die-gruenen
        answer: zu weit
        comment: >-
          Die Grünen enthielten sich bei der Abstimmung zum <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6089ran.pdf">Antrag</a>
          der Koalitionsfraktionen. Sie begrüßten zwar insbesondere die
          Möglichkeit, Simson-Kleinkrafträder auf Elektroantrieb umzurüsten. Bei
          einer erleichterten Zulassung von Reimporten müssten aus ihrer Sicht
          jedoch die <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/101stzg.pdf#page=156">deutschen
          Sicherheitsanforderungen</a> eingehalten werden; zugleich kritisierten
          sie die <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/101stzg.pdf#page=156">Schadstoff-
          und Feinstaubemissionen</a> der traditionellen Zweitaktmotoren.
      - party: afd
        answer: nicht weit genug
        comment: >-
          Die AfD bezeichnete den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6089ran.pdf">Antrag</a>
          zwar als grundsätzlich richtig, enthielt sich jedoch und brachte einen
          eigenen Alternativantrag ein. Ihr reichten die vorgesehenen
          Zulassungserleichterungen nicht aus. Sie verlangte zusätzlich, die
          Simson als <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/101stzg.pdf#page=151">immaterielles
          Kulturerbe</a> anzuerkennen, um das Fahrzeug und seine Besonderheiten
          auch gegenüber künftigen Abgas- und Geschwindigkeitsregelungen stärker
          zu schützen.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6089ran.pdf">Antrag</a>
          zu. Es <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/101stzg.pdf#page=152">sei
          nicht nachvollziehbar</a>, dass in Deutschland verbliebene
          Simson-Kleinkrafträder aufgrund des Einigungsvertrags mit bis zu 60
          km/h zugelassen sind, während baugleiche, später reimportierte Modelle
          teilweise nur 45 km/h fahren dürfen.
