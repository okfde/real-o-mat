      pauschale Verbot von Windenergieanlagen im Wald aufgehoben werden.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
      Recherchen, Klagen und Community-Aktionen. Du möchtest mehr über die
      Energiewende erfahren? Entdecke jetzt unseren <a target="_blank"
      rel="noopener noreferrer"
      href="https://fragdenstaat.de/aktionen/climate-helpdesk/">Climate
      Helpdesk</a>! </p>
    keyword: Windenergie
    answers:
      - party: cdu
        answer: richtig
        comment: >-
          Die CDU stimmt <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d3708lge.pdf">dem
          Gesetzentwurf</a> zu, da das vom Bundesverfassungsgericht beanstandete
          Pauschalverbot von Windanlagen im Wald aufgehoben werden müsse.
          Zugleich betonte sie, dass der Ausbau auf die gesetzlich notwendige
          Fläche begrenzt und <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/068stzg.pdf#page=107">ein
          unkontrollierter Ausbau verhindert werden solle</a>.
      - party: spd
        answer: richtig
        comment: >-
          Die SPD stimmt dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d3708lge.pdf">Gesetzentwurf</a>
          zu. Aus ihrer Sicht würden <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/068stzg.pdf#page=102">weitere
          geeignete Flächen für Windenergie</a> benötigt, um die gesetzlichen
          Ausbauziele zu erreichen.
      - party: die-linke
        answer: nicht weit genug
        comment: >-
          Die Linke enthielt sich bei der Abstimmung zum <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d3708lge.pdf">Gesetzentwurf</a>.
          Sie hielt die Aufhebung des Pauschalverbots grundsätzlich für richtig,
          kritisierte jedoch, dass klare Regelungen fehlten, <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/068stzg.pdf#page=104">um
          eine Schwächung des Natur-, Arten- und Umweltschutzes zu
          verhindern</a>.
      - party: die-gruenen
        answer: nicht weit genug
        comment: >-
          Die Grünen enthielten sich bei der Abstimmung zum <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d3708lge.pdf">Gesetzentwurf</a>,
          da zusätzliche Vorgaben fehlen, damit Windenergieanlagen nur
          ausnahmsweise im Wald und möglichst auf <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/068stzg.pdf#page=106">bereits
          baumfreien Flächen</a> errichtet werden können.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD lehnte <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d3708lge.pdf">den
          Gesetzentwurf</a> ab. Mit einem <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d4267aae.pdf">Änderungsantrag</a>
          wollte sie erreichen, dass „<a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/068stzg.pdf#page=101">kein
          einziges Windrad im Wald entstehen</a>“ solle; denn der Wald sei als
          Naturgebiet wichtig und nicht als Energieerzeugungsgebiet.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP stimmt <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d3708lge.pdf">dem
          Gesetzentwurf</a> zu, da die zuvor als verfassungswidrig bewertete
          Regelung aufgehoben werden müsse. Die Streichung des Pauschalverbots
          bedeute aus ihrer Sicht nicht, dass <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/068stzg.pdf#page=104">Windenergieanlagen
          künftig uneingeschränkt auf allen Waldflächen errichtet werden
          dürften</a>.
  - id: question-10
    index: 10
    category: Bildung
    thesis: >-
      Die Landesregierung soll sich beim Bund dafür einsetzen, dass Studierende
      höhere BAföG-Sätze erhalten.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
