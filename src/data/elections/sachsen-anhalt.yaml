      - party: die-linke
        answer: richtig
        comment: >-
          Die Linke stimmte ihrem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7079dan.pdf">Antrag</a>
          zu. Sie hielt die auf Bundesebene ursprünglich <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/115stzg.pdf#page=180">angekündigten
          Reformschritte zwar nur für ein Mindestmaß</a>, forderte aber, dass
          wenigstens diese vollständig, verbindlich und finanziell abgesichert
