      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
      Recherchen, Klagen und Community-Aktionen. Entdecke jetzt diese spannende
      <a target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/artikel/exklusiv/2025/06/wer-afd-mitgliedern-die-waffen-wegnimmt-und-wer-nicht/">Recherche
      zum Waffenrecht</a>!</p>
    keyword: Waffenrecht
    answers:
      - party: cdu
        answer: richtig
        comment: >-
          Die CDU stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d4102vbs.pdf">Beschluss</a>
          zu. Die Tötung einer Frau mit einer Schusswaffe, die dem Antrag
          vorausging, hätte möglicherweise verhindert werden können, wenn
          Polizei und Waffenbehörde ihre <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/066stzg.pdf#page=120">bestehenden
          rechtlichen Möglichkeiten konsequent genutzt hätten</a>. Deshalb
          brauche es einen verbesserten Informationsaustausch, die
          Fallkonferenzen und eine Überprüfung des Waffenrechts auf Bundesebene,
          jedoch keine generelle Verschärfung des Waffenrechts.
      - party: spd
        answer: richtig
        comment: >-
          Die SPD stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d4102vbs.pdf">Beschluss</a>
          zu. Sie betonte, dass Polizei, Waffenbehörden und Innenministerium
          seit der Tat, die der Debatte vorausging, <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/066stzg.pdf#page=117">Fortschritte
          beim Vollzug des geltenden Waffenrechts</a> erzielt hätten. Eine
          Verschärfung werde mit dem Beschluss ausdrücklich nicht gefordert.
      - party: die-linke
        answer: nicht weit genug
        comment: >-
          Die Linke enthielt sich bei der Abstimmung zum <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d4102vbs.pdf">Beschluss</a>.
          Sie begrüßte zwar etwa den konsequenteren Vollzug des bestehenden
          Rechts. Eine bloße Überprüfung des Waffenrechts sei jedoch nicht
          ausreichend: Die Linke <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/066stzg.pdf#page=118">forderte
          zusätzlich eine Verschärfung des Waffenrechts auf Bundesebene</a> und
          insgesamt weniger Waffen in privatem Besitz.
      - party: die-gruenen
        answer: nicht weit genug
        comment: >-
          Die Grünen enthielten sich bei der Abstimmung zum <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d4102vbs.pdf">Beschluss</a>.
