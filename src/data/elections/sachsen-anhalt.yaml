title: Landtagswahl Sachsen-Anhalt
slug: sachsen-anhalt
date: '2026-09-06'
archived: false
questions:
  - id: question-0
    index: 0
    category: Gesundheit
    thesis: >-
      Pflegende Angehörige sollen in erster Linie durch weniger Bürokratie
      entlastet werden.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
      Recherchen, Klagen und Community-Aktionen. Lies jetzt diese spannende
      Recherche zu den <a target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/artikel/exklusiv/2026/02/In-der-Gefaengnispsychiatrie-jahrelang-isoliert/">Zuständen
      in der Gefängnispsychiatrie</a>.</p>
    keyword: Pflege von Angehörigen
    answers:
      - party: cdu
        answer: richtig
        comment: >-
          Die CDU stimmte dem gemeinsamen <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7141ran.pdf">Antrag</a>
          der Koalitionsfraktionen zu. Sie wollte pflegende Angehörige vor allem
          durch <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/116stzg.pdf#page=181">einfachere
          Antragswege, weniger Bürokratie</a> und verlässliche wohnortnahe
          Angebote entlasten.
      - party: spd
        answer: richtig
        comment: >-
          Die SPD stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7141ran.pdf">Antrag</a>
          zu. Ein Hauptproblem sei, dass bestehende Unterstützungsangebote wegen
          <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/116stzg.pdf#page=188">komplizierter
          und kleinteiliger Verfahren</a> häufig nicht bei den Betroffenen
          ankommen. Pflegende Angehörige sollten deshalb verlässlichere
          Strukturen, einfachere Ansprechpartner, wohnortnahe Angebote und mehr
          Mitsprache erhalten.
      - party: die-linke
        answer: nicht weit genug
        comment: >-
          Die Linke lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7141ran.pdf">Antrag</a>
          ab, obwohl sie dessen Ziele ausdrücklich für richtig hielt. Die
          vorgesehenen Maßnahmen gingen <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/116stzg.pdf#page=187">jedoch
          nicht weit genug</a>. Sie forderte zusätzlich Pflegelotsen zur
          Orientierung im Hilfesystem, ein rund um die Uhr erreichbares
          Servicetelefon, eine unabhängige Pflegeberatung und sechs Wochen
          bezahlte Freistellung beim erstmaligen Auftreten eines familiären
          Pflegefalls.
      - party: die-gruenen
        answer: nicht weit genug
        comment: >-
          Die Grünen enthielten sich bei der Abstimmung zum <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7141ran.pdf">Antrag</a>.
          Die Maßnahmen seien <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/116stzg.pdf#page=190">ambitionslos</a>.
          Die Grünen forderten darum einen umfassenderen Ansatz. Neben „Pflege
          im Quartier“ sollten unter anderem Tagespflege, flexible
          Betreuungszeiten, Nachtcafés, finanzielle Hilfen und regionale
          Gesundheitskonferenzen ausgebaut werden.
      - party: afd
        answer: nicht weit genug
        comment: >-
          Die AfD enthielt sich bei der Abstimmung zum <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7141ran.pdf">Antrag</a>.
          Sie erkannte die bisherigen Maßnahmen zur Unterstützung pflegender
          Angehöriger grundsätzlich an, hielt den Antrag der
          Koalitionsfraktionen aber <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/116stzg.pdf#page=184">für
          keine ausreichende Antwort auf die existierenden Probleme</a> in der
          Pflege Angehöriger. Nach mehreren Jahren politischer Initiativen seien
          weitere Prüfaufträge zu wenig.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7141ran.pdf">Antrag</a>
          zu. Bestehende Informationen und Hilfsangebote würden so leichter
          zugänglich gemacht, <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/116stzg.pdf#page=186">niedrigschwellige
          Anlaufstellen geschaffen und bürokratische Hürden</a> abgebaut.
          Unterstützung müsse schnell, unbürokratisch und verlässlich bei
          pflegenden Angehörigen ankommen.
  - id: question-1
    index: 1
    category: Justiz
    thesis: >-
      Die Landesregierung soll sich dafür einsetzen, dass Fahren ohne Ticket
      entkriminalisiert wird.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern setzt sich mit
      investigativen Recherchen, Klagen und Community-Aktionen für mehr
      Transparenz ein. Du möchtest selbst spannende Informationen über
      Politiker*innen und Behörden ans Licht bringen? Stelle jetzt eine <a
      target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/informationsfreiheit/einsteiger-guide/">IFG-Anfrage</a>!</p>
    keyword: Fahren ohne Ticket
    answers:
      - party: cdu
        answer: zu weit
        comment: >-
          Die CDU lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6851gan.pdf">Antrag
          der Grünen</a> ab und stellte mit der Koalitionsfraktion einen <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6890raa.pdf">Alternativantrag
          zu Sicherheit im Öffentlichen Personennahverkehr</a>, der keine
          Entkriminalisierung des Fahrens ohne Fahrschein vorsieht. <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf#page=109">In
          ihrer Rede</a> begründete sie ihre Ablehnung dieser konkreten
          Forderung nicht, sondern konzentrierte sich auf Sicherheitsmaßnahmen,
          eine bessere Infrastruktur und mehr Investitionen in den öffentlichen
          Nahverkehr.
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD stimmt gegen den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6851gan.pdf">Antrag
          der Grünen</a> und für den <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6890raa.pdf">Alternativantrag</a>
          der Koalitionsfraktionen, der die Entkriminalisierung nicht vorsieht.
          In ihrer entsprechenden Rede positioniert sie sich nicht weiter zu dem
          Thema, sondern stellt einen <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf#page=104">sicheren
          und bezahlbaren Nahverkehr</a> in den Mittelpunkt.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Linke stimmt dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6851gan.pdf">Antrag
          der Grünen</a> zu.  In der Plenardebatte begründete sie diese
          Einzelposition nicht näher. In einer <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.dielinke-sachsen-anhalt.de/aktuell-1/detail/news/fahren-ohne-ticket-muss-entkriminalisiert-werden/">offiziellen
          Stellungnahme</a> bezeichnete sie die strafrechtliche Verfolgung
          jedoch als unverhältnismäßig und verwies darauf, dass die
          Kriminalisierung des Fahrens ohne Ticket insbesondere Menschen in
          schwierigen Lebenslagen treffe sowie Polizei, Justiz und Strafvollzug
          unnötig belaste.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Grünen stimmen ihrem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6851gan.pdf">eigenen
          Antrag</a> zu. Fahren ohne Fahrschein solle weiterhin sanktioniert
          werden, eine strafrechtliche <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf#page=115">Verfolgung
          bis hin zur Haft</a> sei aber unverhältnismäßig. Ähnlich wie das
          Parken ohne Parkschein solle es künftig als Ordnungswidrigkeit
          behandelt werden.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6851gan.pdf">Antrag
          der Grünen</a> ab. Fahren ohne Fahrschein sei kein Bagatelldelikt mit
          geringer krimineller Energie, sondern „<a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf#page=108">asoziales
          Verhalten</a>“, das nichts mit Armut zu tun habe.
      - party: fdp
        answer: zu weit
        comment: >-
          Die FDP lehnt den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6851gan.pdf">Antrag
          der Grünen</a> ab. Es könne keine Lösung sein, Schwarzfahren zum
          „Kavaliersdelikt“ zu machen. „<a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf#page=114">Diejenigen,
          die ihre Fahrkarte bezahlen, wären dann die Dummen</a>“ und dies käme
          einer Bankrotterklärung des Staates gleich.
  - id: question-2
    index: 2
    category: Demokratie & Institutionen
    thesis: >-
      Sachsen-Anhalt soll im Alleingang alle Rundfunkstaatsverträge kündigen, um
      den öffentlich-rechtlichen Rundfunk in seiner jetzigen Form abzuschaffen.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
      Recherchen, Klagen und Community-Aktionen. Du findest unabhängige,
      investigative Berichterstattung wichtig? Entdecke jetzt <a target="_blank"
      rel="noopener noreferrer" href="https://fragdenstaat.de/recherchen">unsere
      aktuellen Recherchen</a>! </p>
    keyword: Rundfunkstaatsvertrag
    answers:
      - party: cdu
        answer: zu weit
        comment: >-
          Die CDU lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6332aan.pdf">Antrag
          der AfD-Fraktion</a> ab. Sie bekannte sich zum Grundmodell des
          öffentlich-rechtlichen Rundfunks. Es müsse eine <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/103stzg.pdf#page=42">unabhängige,
          neutrale und ausgewogene Berichterstattung</a> auf Grundlage
          einheitlicher journalistischer Qualitätsstandards gewährleistet
          werden.
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6332aan.pdf">Antrag
          der AfD</a> ab. In der <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/103stzg.pdf#page=34">Plenardebatte</a>
          betont sie die Bedeutung von unabhängigem Journalismus, Vielfalt und
          demokratischer Kontrolle, die durch den öffentlich-rechtlichen
          Rundfunk gesichert werde.
      - party: die-linke
        answer: zu weit
        comment: >-
          Die Linke <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6332aan.pdf">lehnte
          den Antrag der AfD</a> ab. Er offenbare „ein klares Konzept für einen
          Einstieg in die <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/103stzg.pdf#page=36">Zerstörung
          wesentlicher Elemente unseres föderalen Systems</a> und unserer
          demokratischen Grundordnung“. Reformvorschläge sollten stattdessen in
          der zuständigen Enquete-Kommission erarbeitet werden, nicht über eine
          <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/103stzg.pdf#page=37">einseitige
          Kündigung</a>.
      - party: afd
        answer: richtig
        comment: >-
          Die AfD stimmte ihrem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6332aan.pdf">eigenen
          Antrag</a> zu. Sie kritisierte den Rundfunkbeitrag als „<a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/103stzg.pdf#page=23">Zwangsabgabe</a>“
          und vertrat die Auffassung, dass man nicht für öffentlich-rechtliche
          Angebote, die die Fraktion als „<a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/103stzg.pdf#page=24">Desinformation</a>“
          bezeichnet, bezahlen solle, wenn man sie nicht konsumieren möchte.
      - party: fdp
        answer: zu weit
        comment: >-
          Die FDP lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6332aan.pdf">Antrag</a>
          der AfD ab. Der öffentlich-rechtlichen Rundfunk sei notwendig, um <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/103stzg.pdf#page=38">unabhängige,
          neutrale und objektive Informationen im Sinne des Grundgesetzes</a> zu
          sichern. Zugleich sprach sie sich für eine Reform des bestehenden
          Systems aus.
      - party: die-gruenen
        answer: zu weit
        comment: >-
          Die Grünen lehnten den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6332aan.pdf">Antrag</a>
          der AfD ab. Sie betonten, dass der öffentlich-rechtliche Rundfunk
          notwendig sei, um die <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/103stzg.pdf#page=41">Unabhängigkeit
          der Medien von der jeweiligen Regierung zu sichern</a> und eine
          politische Einflussnahme zu verhindern.
  - id: question-3
    index: 3
    category: Strukturwandel
    thesis: >-
      Um Angebote für Jugendliche in ländlichen Regionen zu fördern, sollen die
      dafür vorgesehenen Gelder nicht nur nach Einwohnerzahl, sondern auch nach
      Fläche verteilt werden.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern setzt sich mit
      investigativen Recherchen, Klagen und Community-Aktionen für mehr
      Transparenz ein. Du möchtest selbst spannende Informationen über
      Politiker*innen und Behörden ans Licht bringen? Stelle jetzt eine <a
      target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/informationsfreiheit/einsteiger-guide/">IFG-Anfrage</a>!</p>
    keyword: Jugendförderung
    answers:
      - party: cdu
        answer: richtig
        comment: >-
          Die CDU stimmt <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d1710ran.pdf">ihrem
          eigenen Antrag</a> zu. Mit dem Flächenfaktor sollen die <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/028stzg.pdf#page=93">besonderen
          Bedingungen ländlicher Regionen berücksichtigt</a> und die
          Lebensverhältnisse von jungen Menschen in Stadt und Land weiter
          angeglichen werden.
      - party: spd
        answer: richtig
        comment: >-
          Die SPD stimmte dem eigenen <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d1710ran.pdf">Antrag</a>
          zu, weil sich die Förderung der Jugendarbeit künftig nicht mehr allein
          nach der Zahl der Kinder und Jugendlichen richten sollte. Der
          Flächenfaktor bilde <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/028stzg.pdf#page=98">größere
          Entfernungen, schlechtere Verkehrsverbindungen und die besonderen
          Bedingungen der Jugendarbeit auf dem Land</a> besser ab. Die Städte
          sollten dabei keine Mittel verlieren.
      - party: die-linke
        answer: nicht weit genug
        comment: >-
          Die Linke enthielt sich bei der Abstimmung <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d1710ran.pdf">zum
          Antrag der Koalitionsfraktionen</a>, da ihr eine andere Verteilung der
          Gelder zwischen Städten und Landkreisen allein nicht ausreiche.
          Angesichts geschlossener Einrichtungen, steigender Personal- und
          Sachkosten sowie jahrelanger Unterfinanzierung forderte sie <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/028stzg.pdf#page=94">deutlich
          mehr Geld für die örtliche Jugendarbeit</a>. Außerdem forderte sie ein
          konkretes Verteilungsmodell und eine eigenständige Finanzierung der
          Schulsozialarbeit.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Grünen stimmten dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d1710ran.pdf">Antrag</a>
          zu und verwiesen darauf, den Flächenfaktor bereits zuvor selbst
          gefordert zu haben. Die bisherige Verteilung benachteilige Landkreise
          mit großen Entfernungen und wenigen Einwohner*innen. Die Reform sei
          deshalb notwendig, um den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/028stzg.pdf#page=99">gleichwertigen
          Lebensverhältnissen in Stadt und Land näherzukommen</a>.
      - party: afd
        answer: nicht weit genug
        comment: >-
          Die AfD enthielt sich bei der Abstimmung <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d1710ran.pdf">zum
          Antrag</a>, obwohl sie die Einführung eines Flächenfaktors
          grundsätzlich unterstützte. Aus ihrer Sicht griff der Antrag jedoch zu
          kurz, weil die Jugendarbeit insgesamt weiterhin nicht auskömmlich
          finanziert werde. Sie forderte, <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/028stzg.pdf#page=92">das
          Anliegen des Kinder- und Jugendrings</a> nach zusätzlichen Mitteln und
          einer stärkeren jährlichen Erhöhung der Förderung im Ausschuss zu
          beraten.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP stimmt <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d1710ran.pdf">ihrem
          eigenen Antrag</a> zu. Der Flächenfaktor solle die <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/028stzg.pdf#page=87">Jugendarbeit
          auf dem Land</a> stärken und das <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/028stzg.pdf#page=88">finanzielle
          Gefälle</a> zwischen Landkreisen und kreisfreien Städten verringern,
          ohne den Städten Mittel zu entziehen. Weitergehende Forderungen der
          Linken lehnte sie in diesem Antrag als zu breit und aufgrund nicht
          ausreichender Gegenfinanzierung ab.
  - id: question-4
    index: 4
    category: Energie
    thesis: >-
      Sachsen-Anhalt soll die Energiewende beschleunigen, sich aber nicht auf
      konkrete Klimaziele festlegen.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
      Recherchen, Klagen und Community-Aktionen. Du möchtest mehr über die
      Energiewende erfahren? Entdecke jetzt unseren <a target="_blank"
      rel="noopener noreferrer" href="https://fragdenstaat.de/climate">Climate
      Helpdesk</a>! </p>
    keyword: Energiewende
    answers:
      - party: cdu
        answer: richtig
        comment: >-
          Die CDU stimmte der <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d1971vbe.pdf">Beschlussempfehlung</a>
          zu. Sie setze auf schnellere Genehmigungen, technologieoffene Lösungen
          und Vorteile für die Menschen vor Ort. Eine Energiewende „<a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/068stzg.pdf#page=107">mit
          der Brechstange</a>“ lehne sie ab.
      - party: spd
        answer: richtig
        comment: >-
          Die SPD stimmte der <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d1971vbe.pdf">Beschlussempfehlung</a>
          zu. Sie wolle den Ausbau durch schnellere Genehmigungen, lokale
          Wertschöpfung und eine finanzielle Beteiligung der Kommunen
          voranbringen. <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/003stzg.pdf#page=36">Verbindliche
          Ausbauzahlen und politischer Druck allein</a> reichten dafür nicht
          aus.
      - party: die-linke
        answer: nicht weit genug
        comment: >-
          Die Linke enthielt sich der Abstimmung über die <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d1971vbe.pdf">Beschlussempfehlung</a>.
          Sie unterstütze die Energiewende grundsätzlich, notwendig seien aber
          <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/003stzg.pdf#page=21">Klimaneutralität
          bis 2035, konkrete Zwischenziele</a>, ein CO₂-Budget und eine
          Solarpflicht. Die weniger verbindliche Beschlussempfehlung reiche ihr
          daher nicht aus.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD lehnte die <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d1971vbe.pdf">Beschlussempfehlung</a>
          ab. Sie fürchtet eine „<a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/033stzg.pdf#page=110">nachträgliche
          Legalisierung rechtswidriger Windräder</a>“ und eine „Verschandelung“
          der Kulturlandschaft Sachsen-Anhalt.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP stimmte der <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d1971vbe.pdf">Beschlussempfehlung</a>
          zu. Erneuerbare Energien seien grundsätzlich als möglicher Jobmotor zu
          sehen, sie lehne aber „<a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/003stzg.pdf#page=30">starre
          Vorgaben“ beim Bau von Windrädern</a> und eine verpflichtende
          Installation von Solaranlagen ab.
      - party: die-gruenen
        answer: nicht weit genug
        comment: >-
          Die Grünen enthielten sich bei der Abstimmung, obwohl die <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d1971vbe.pdf">Beschlussempfehlung</a>
          auf einen Antrag der eigenen Fraktion zurückgeht. Doch <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/003stzg.pdf#page=21">zentrale
          Forderungen ihres ursprünglichen Antrags</a>, darunter
          Klimaneutralität bis 2035, eine Solarpflicht und das
          Zwei-Prozent-Flächenziel für Windenergie, wurden nicht in den
          Beschluss übernommen.
  - id: question-5
    index: 5
    category: Demokratie & Institutionen
    thesis: >-
      Der Fortbestand der Landeszentrale für politische Bildung soll gesetzlich
      abgesichert werden.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
      Recherchen, Klagen und Community-Aktionen. Hier findest Du eine spannende
      Recherche zur <a target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/artikel/exklusiv/2026/03/radikale-tochter/">Demokratieförderung</a>!</p>
    keyword: Landeszentrale für politische Bildung
    answers:
      - party: cdu
        answer: richtig
        comment: >-
          Die CDU stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6653wge.pdf">Gesetzentwurf</a>
          zu. Sie bezeichnete die Landeszentrale für politische Bildung als
          unverzichtbar, weil diese <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/109stzg.pdf#page=29">faktenbasierte
          politische Bildung</a> vermittle, Extremismus entgegenwirke und
          demokratische Werte verteidige. Eine Abschaffung würde die <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf#page=9">Demokratie
          schwächen und Desinformation sowie Radikalisierung</a> begünstigen.
      - party: spd
        answer: richtig
        comment: >-
          Die SPD stimmte der <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6653wge.pdf">Parlamentsreform</a>
          und damit der gesetzlichen Verankerung der Landeszentrale zu. Sie
          ordnete die Bestandsgarantie der Landeszentrale in das übergeordnete
          Ziel ein, <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/109stzg.pdf#page=15">demokratische
          Institutionen widerstandsfähiger gegen Missbrauch und
          antidemokratische Angriffe</a> zu machen.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Linke stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6653wge.pdf">Gesetzentwurf</a>
          zu, weil es wichtig sei, dass die Landeszentrale eine <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf#page=12">gesetzliche
          Grundlage</a> bekomme. Jedoch hätte die Fraktion eine weitergehende
          Absicherung der inhaltlichen Arbeit, nicht nur des Bestands der
          Landeszentrale, gewünscht.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Grünen stimmten der gesetzlichen <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6653wge.pdf">Bestandsgarantie</a>
          der Landeszentrale zu. Dass die Landeszentrale nun eine gesetzliche
          Grundlage erhielte, sei der <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/109stzg.pdf#page=26">Bedeutung
          der Institution</a> angemessen. So müsse über eine mögliche
          Abschaffung der Landeszentrale künftig der Landtag entscheiden.
          Zugleich betrachteten sie die Regelung nur als Mindestlösung und
          hätten die Aufgaben und die institutionelle Absicherung der
          Landeszentrale lieber in einem eigenen Gesetz ausführlicher geregelt.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6653wge.pdf">Gesetzentwurf</a>
          ab. Sie betrachtet die Landeszentrale als <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/109stzg.pdf#page=13">Instrument
          politischer Indoktrination</a> und hatte wiederholt ihre Abschaffung
          gefordert. Die gesetzliche Verpflichtung, eine Landeszentrale zu
          unterhalten, wertete sie als gezielten Versuch, eine solche
          Abschaffung <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/112stzg.pdf#page=8">durch
          eine künftige AfD-geführte Landesregierung</a> zu verhindern.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6653wge.pdf">Gesetzentwurf</a>
          zu. Sie begründete ihre Haltung zur Landeszentrale nicht gesondert,
          sondern stellte vor allem die <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/109stzg.pdf#page=7">Funktionsfähigkeit
          und institutionelle Absicherung der parlamentarischen Demokratie
          insgesamt</a> in den Mittelpunkt.
  - id: question-6
    index: 6
    category: Bildung
    thesis: >-
      Wenn die Bundeswehr Schulen besucht, sollen auch Friedensorganisationen zu
      Wort kommen können. Das muss nicht verpflichtend vor derselben Schulklasse
      stattfinden.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
      Recherchen, Klagen und Community-Aktionen. Lies jetzt diese spannende
      Recherche zum <a target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/artikel/klagen/2024/07/hintergrunde-zum-sondervermogen-der-bundeswehr-bleiben-geheim/">Sondervermögen
      der Bundeswehr</a>!</p>
    keyword: Bundeswehr an Schulen
    answers:
      - party: cdu
        answer: richtig
        comment: >-
          Die CDU stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7170raa.pdf">Antrag</a>
          zu. Eine kontroverse Behandlung von Friedens- und Sicherheitspolitik
          sei unterstützenswert, doch es brauche keine <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/116stzg.pdf#page=154">verpflichtende
          Gegenüberstellung</a> bestimmter externer Akteure. Entscheidend sei,
          dass unterschiedliche Positionen im Unterricht ausgewogen behandelt
          würden; welche externen Partner dafür wann eingebunden werden, sollten
          die <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/116stzg.pdf#page=154">Lehrkräfte
          selbst entscheiden</a>.
      - party: spd
        answer: richtig
        comment: >-
          Die SPD stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7170raa.pdf">Antrag</a>
          zu. Man müsse sicherstellen, dass Schüler*innen bei Bundeswehrbesuchen
          unterschiedliche sicherheits- und friedenspolitische Perspektiven
          kennenlernen. Deshalb sollten parallel oder zeitnah zu
          Bundeswehrbesuchen auch friedenspolitische Organisationen eingeladen
          werden. Eine <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/116stzg.pdf#page=145">verpflichtende
          gemeinsame Veranstaltung</a> vor derselben Gruppe hielt sie jedoch
          nicht für notwendig; wenn keine entsprechende Organisation teilnehmen
          könne, solle die Lehrkraft die Gegenposition selbst in den Unterricht
          einbringen.
      - party: die-linke
        answer: nicht weit genug
        comment: >-
          Die Linke enthielt sich bei der Abstimmung zum <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7170raa.pdf">Antrag</a>
          der Koalitionsfraktionen. Stattdessen stimmte sie für ihren eigenen <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7093dan.pdf">Antrag</a>.
          Es sei begrüßenswert, friedenspolitische Perspektiven einzubeziehen,
          doch die unverbindliche Regelung sei nicht ausreichend.
          Friedenspolitische Organisationen sollten im gleichen Umfang wie
          Jugendoffizier_innen zu Wort kommen und Bundeswehrbesuche deshalb <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/116stzg.pdf#page=139">verbindlich
          mit entsprechenden Angeboten</a> für dieselben Schüler_innengruppen
          verbunden werden.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Grünen stimmten dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7170raa.pdf">Antrag</a>
          der Regierungskoalition zu. Die Einbeziehung unterschiedlicher
          Perspektiven sei wichtig, man wolle Schulen aber <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/116stzg.pdf#page=152">keine
          zusätzliche verpflichtende Gegenüberstellung</a> externer Akteure
          vorschreiben. Lehrkräfte und Schulen <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/116stzg.pdf#page=153">sollten
          selbst gewährleisten</a>, dass der Beutelsbacher Konsens eingehalten
          und kontroverse Positionen angemessen berücksichtigt werden.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7170raa.pdf">Antrag</a>
          der Koalitionsfraktionen ab. Auftritte der <a target="_blank"
          rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/116stzg.pdf#page=149">Bundeswehr
          an Schulen seien legitim</a>. Es gebe keinen Grund, diese
          verpflichtend durch Auftritte friedenspolitischer Organisationen zu
          ergänzen. Bundeswehrveranstaltungen sollten aus ihrer Sicht auch für
          sich allein stehen können.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP stimmte dem gemeinsamen <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7170raa.pdf">Antrag</a>
          der Koalitionsfraktionen zu. Sie unterstützte Bundeswehrbesuche an
          Schulen und betonte zugleich die Verantwortung der Lehrkräfte für eine
          kontroverse Behandlung politischer Fragen. Welche externen Akteure
          eingebunden werden und wie unterschiedliche Perspektiven vermittelt
          werden, solle <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/116stzg.pdf#page=150">nicht
          durch starre Vorgaben</a> geregelt, sondern von den Schulen
          eigenverantwortlich entschieden werden.
  - id: question-7
    index: 7
    category: Verkehr & Infrastruktur
    thesis: >-
      Der Radverkehr soll stärker gefördert und bei der Verkehrsplanung besser
      berücksichtigt werden.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern setzt sich mit
      investigativen Recherchen, Klagen und Community-Aktionen für mehr
      Transparenz ein. Du möchtest selbst spannende Informationen über
      Politiker*innen und Behörden ans Licht bringen? Stelle jetzt eine <a
      target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/informationsfreiheit/einsteiger-guide/">IFG-Anfrage</a>!</p>
    keyword: Radverkehr
    answers:
      - party: cdu
        answer: zu weit
        comment: >-
          Die CDU lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6410gan.pdf">Antrag
          der Grünen</a> ab. Sie hielt <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/111stzg.pdf#page=201">zusätzliche
          verbindliche Standards, neue Pflichten und weitergehende finanzielle
          Versprechen</a> angesichts ausgeschöpfter Fördermittel und fehlenden
          Fachpersonals für nicht realistisch. Stattdessen stellte sie mit der
          Regierungskoalition einen Alternativantrag, um Radwege schrittweise
          auszubauen und <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/111stzg.pdf#page=201">Qualitätsstandards
          nur so weiterzuentwickeln</a>, dass die Kommunen dadurch nicht
          überfordert werden.
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6410gan.pdf">Antrag</a>
          der Grünen ab und unterstützte den weniger weitreichenden
          Alternativantrag der Koalition. Sie räumte ein, dass die <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/111stzg.pdf#page=204">bisherigen
          Mittel</a> angesichts der Lücken im Radwegenetz nicht ausreichten und
          mit mehr Geld auch mehr Radwege gebaut werden könnten.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Linke stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6410gan.pdf">Antrag</a>
          der Grünen zu. Sie betonte die <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/111stzg.pdf#page=205">Wichtigkeit
          des Radverkehrs</a> und kritisierte, dass das Radverkehrsnetz
          weiterhin erhebliche Lücken aufweise und der Ausbau dem tatsächlichen
          Bedarf weit hinterherhinke.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Grünen stimmten ihrem eigenen <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6410gan.pdf">Antrag</a>
          zu. Aus ihrer Sicht werde <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/111stzg.pdf#page=196">das
          Fahrrad gegenüber dem Auto und dem öffentlichen Nahverkehr weiterhin
          benachteiligt</a> und bei Haushaltsmitteln sowie im Straßenbau nur
          nachrangig behandelt. Sie forderten einen politischen Richtungswechsel
          mit stärkerer Finanzierung und einer gleichberechtigten
          Berücksichtigung des Radverkehrs in der Mobilitätspolitik.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6410gan.pdf">Antrag</a>
          der Grünen ab. Die Vorstellung, das Fahrrad könne dem Auto als
          Verkehrsmittel gleichgestellt werden, sei insbesondere im ländlichen
          Raum unrealistisch, da viele Menschen lange Arbeitswege zurücklegen
          müssten und auf das Auto angewiesen seien. Investitionen sollten aus
          ihrer Sicht zunächst in die <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/111stzg.pdf#page=202">Sanierung
          von Straßen und Brücken</a> fließen.
      - party: fdp
        answer: zu weit
        comment: >-
          Die FDP lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d6410gan.pdf">Antrag</a>
          der Grünen ab. Der Radverkehr solle weiter ausgebaut werden, es solle
          jedoch <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/111stzg.pdf#page=206">keine
          Verkehrspolitik geben, die das Auto zurückdrängt</a> oder einzelne
          Verkehrsmittel gegeneinander ausspielt; man setze auf einen
          pragmatischen Ausbau bestehender Radwege.
  - id: question-8
    index: 8
    category: Innere Sicherheit
    thesis: >-
      Die Landesregierung soll sich auf Bundesebene für eine Überprüfung des
      Waffenrechts einsetzen – nicht für eine Verschärfung.
