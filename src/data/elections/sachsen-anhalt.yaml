          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d7079dan.pdf">Antrag</a>
          der Linken ab und stimmte stattdessen für den weniger verbindlichen
          Alternativantrag der Koalitionsfraktionen. Zwar sei eine <a
          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/115stzg.pdf#page=173">Anpassung
          des BAföG an die Preisentwicklung grundsätzlich richtig</a>, doch man
