          target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/066stzg.pdf#page=122">Zusätzliche
          Einschränkungen</a> werde es mit der FDP jedoch weder in der Bundes-
          noch in der Landesregierung geben.
  - id: question-9
