          href="(https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/066stzg.pdf#page=121">forderten
          unter anderem bessere Kontrollen, mehr Personal und eine engere
          Zusammenarbeit der Behörden</a>. Eine bloße Überprüfung ohne konkrete
          Konsequenzen ginge jedoch nicht weit genug, an einzelnen Stellen seien
          gesetzliche Nachbesserungen notwendig.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/drs/wp8/drs/d4102vbs.pdf">Beschluss</a>
          ab. Sie sah bereits in der angekündigten Überprüfung des Waffenrechts
          eine mögliche Vorbereitung weiterer Verschärfungen und warf den
          übrigen Fraktionen vor, legale Waffenbesitzer unter Generalverdacht zu
          stellen. Der Beschluss bedrohe etwa <a target="_blank" rel="noopener
          noreferrer"
          href="https://padoka.landtag.sachsen-anhalt.de/files/plenum/wp8/066stzg.pdf#page=116">die
