archived: false
questions:
  - id: question-0
    index: 0
    category: Wohnen
    thesis: >-
      Die Landesregierung soll sich für einen bundesweiten Mietendeckel
      einsetzen. 
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern setzt sich mit
      investigativen Recherchen, Klagen und Community-Aktionen für mehr
      Transparenz ein. Du möchtest selbst spannende Informationen über
      Politiker*innen und Behörden ans Licht bringen? <a target="_blank"
      rel="noopener noreferrer"
      href="https://fragdenstaat.de/informationsfreiheit/einsteiger-guide/"><u>Stelle
      jetzt eine IFG-Anfrage!</u></a></p>
    keyword: Mietendeckel
    answers:
      - party: cdu
        answer: zu weit
        comment: >-
          Die CDU-Fraktion stimmte gegen den <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2058.pdf"><u>Antrag</u></a>
          der Linken, da der Mietendeckel eine <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-078-pp.pdf#page=55">Fehlentscheidung
          der Vergangenheit</a> gewesen sei, welcher zu einer Senkung der
          angebotenen Wohnungen geführt habe. Man solle sich stattdessen darauf
          fokussieren den Wohnungsbau zu fördern.
      - party: spd
        answer: nicht weit genug
        comment: >-
          Die SPD stimmte gegen den <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2058.pdf"><u>Antrag</u></a>,
          obwohl der Mietendeckel auf eine <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-078-pp.pdf#page=58"><u>Idee
          der SPD zurückzuführen sei</u></a>. Die Partei fordert eine <a
          target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-078-pp.pdf#page=58">Länderöffnungsklausel
          im Mietrecht</a>, damit Bundesländer mit angespannten Wohnungsmärkten
          handlungsfähig seien. Zudem forderte sie eine Reform des
          Mietwucherparagrafen und die Begrenzung der Indexmieten.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Fraktion der Linken stimmte für ihren eigenen <a target="_blank"
          rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2058.pdf"><u>Antrag</u></a>,
          <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-078-pp.pdf#page=54"><u>da
          hohe Mieten die größte Existenzangst für Berlinerinnen und Berliner
          seien. Die Mieten seien zudem explosionsartig angestiegen</u></a>.
          Bisher habe es an einer politischen Lösung gemangelt, doch ein
          bundesweiter Mietendeckel könne die „Mietabzocke“ stoppen.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Fraktion der Grünen stimmte für den <a target="_blank"
          rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2058.pdf"><u>Antrag</u></a>,
          da viele Menschen mehr als ein Drittel ihres Einkommens für die Miete
          ausgeben. Der Mietendeckel sei kein Allheilmittel, <a target="_blank"
          rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-078-pp.pdf#page=56">jedoch
          eine notwendige Notbremse</a>.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD hat gegen den<a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2058.pdf"><u>
          Antrag</u></a> der Linken gestimmt, da Berlin <a target="_blank"
          rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-078-pp.pdf#page=60">keinen
          „verfassungswidrigen Mietendeckel“ brauche</a>, sondern
          Entbürokratisierung und massive Entlastungen bei staatlichen
          Nebenkosten.
  - id: question-1
    index: 1
    category: Verkehr & Infrastruktur
    thesis: Die A100 soll nicht weiter verlängert werden.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
      Recherchen, Klagen und Community-Aktionen. Du möchtest mehr über unsere
      Projekte zu Klima und Umwelt erfahren? Entdecke jetzt unseren <a
      target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/climate"><u>Climate Helpdesk</u></a>!</p>
    keyword: A100-Ausbau
    answers:
      - party: cdu
        answer: zu weit
        comment: >-
          Die CDU lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-1139.pdf"><u>Antrag</u></a>
          der Grünen ab. Der Weiterbau der A100 über den Treptower Park hinaus
          sei notwendig, um den Berliner Nordosten besser anzubinden, Straßen in
          Wohngebieten zu entlasten und für weniger Staus zu sorgen, die auch zu
          <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-070-wp.pdf#page=47"><u>wirtschaftlichem
          Schaden</u></a> führen.
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD stimmte gegen den <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-1139.pdf"><u>Antrag</u></a>
          der Grünen. Zwar stimmte die SPD dem Antrag inhaltlich zu und betonte,
          dass eine <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-070-wp.pdf#page=51"><u>Verlängerung
          der A100 nicht sinnvoll sei</u></a>. Dennoch betonte die Fraktion,
          dass <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-070-wp.pdf#page=51"><u>sie
          nicht gegen ihren Koalitionspartner CDU stimmen</u></a> wolle und
          lehnte den Antrag somit ab.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Linke stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-1139.pdf"><u>Antrag</u></a>
          der Grünen zu und forderte ebenfalls, die A100 am Treptower Park
          dauerhaft zu beenden. Der Weiterbau sei klimapolitisch, städtebaulich
          und verkehrspolitisch falsch. Die <a target="_blank" rel="noopener
          noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-070-wp.pdf#page=50"><u>dafür
          vorgesehenen Milliarden könne man stattdessen unter anderem in Bus-,
          Bahn- und Radverkehr investieren</u></a>.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Grünen stimmten ihrem eigenen <a target="_blank" rel="noopener
          noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-1139.pdf"><u>Antrag</u></a>
          zu. Ein weiterer Bauabschnitt könne das Chaos der A100 nicht lösen.
          Statt eines Ausbaus brauche es vielmehr eine <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-070-wp.pdf#page=46"><u>Leistungsfähigkeitsprüfung</u></a>
          des aktuellen Abschnitts 16.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-1139.pdf"><u>Antrag</u></a>
          der Grünen ab. Sie forderte nicht nur, <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-070-wp.pdf#page=53"><u>den
          17. Bauabschnitt möglichst schnell bauen zu lassen, sondern
          perspektivisch auch weitere Abschnitte bis zum Ringschluss </u></a>der
          Autobahn. Sie erwartet davon eine bessere Anbindung der östlichen
          Bezirke und eine Entlastung der innerstädtischen Straßen.
  - id: question-2
    index: 2
    category: Demokratie & Institutionen
    thesis: >-
      Die Landesregierung soll sich auf Bundesebene dafür einsetzen, dass
      Menschen aus Nicht-EU-Ländern mit festem Wohnsitz in Deutschland nach fünf
      Jahren bei Landes- und Kommunalwahlen wählen dürfen.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
      Recherchen, Klagen und Community-Aktionen. Du findest unabhängige,
      investigative Berichterstattung wichtig? Entdecke jetzt unsere <a
      target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/recherchen"><u>Recherchen</u></a>!</p>
    keyword: Wahlrecht
    answers:
      - party: cdu
        answer: zu weit
        comment: >-
          Die CDU hat den <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-0989.pdf">Antrag</a>
          der Fraktion Bündnis 90/Die Grünen und der Linken abgelehnt, da das
          Wahlrecht für alle mit der Verfassungsordnung und den Grundprinzipien
          der demokratischen Ordnung aus ihrer Sicht <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-049-wp.pdf#page=93">nicht
          vereinbar sei</a>. Das Wahlrecht sei kein Menschenrecht, sondern ein
          Staatsbürgerrecht, wer dies in Frage stelle, wende sich gegen die
          Grundfeste der Verfassungsordnung.
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD-Fraktion hat gegen den <a target="_blank" rel="noopener
          noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-0989.pdf">Antrag</a>
          gestimmt. Es sei zwar keine gute Situation, dass so viele Menschen in
          Berlin an den Wahlen nicht teilnehmen können. Die <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-049-wp.pdf#page=96">verfassungsrechtlichen
          Hürden seien aber zu hoch</a> und die Aussichten sehr gering, dass
          Menschen aus Nicht-EU-Ländern nach fünf Jahren in Deutschland wählen
          dürfen. Aus diesem Grund würde die SPD lieber <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-049-wp.pdf#page=96">Änderungen
          am Erteilen der Staatsangehörigkeit vornehmen</a> und nicht am
          Wahlrecht.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Linke hat für den eigenen <a target="_blank" rel="noopener
          noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-0989.pdf"><u>Antrag</u></a>
          gestimmt, da <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-049-wp.pdf#page=92"><u>17
          Prozent der Menschen in Berlin</u></a> von den Wahlen ausgeschlossen
          seien, obwohl viele davon schon lange in Deutschland leben. Die Linke
          setze sich für „<a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-049-wp.pdf#page=93"><u>mehr
          Teilhabe, mehr Gerechtigkeit, mehr Demokratie und für das Wahlrecht
          für alle</u></a>“ ein.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Grünen haben für den eigenen <a target="_blank" rel="noopener
          noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-0989.pdf"><u>Antrag</u></a>
          gestimmt, da es ein <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-049-wp.pdf#page=95"><u>Demokratiedefizit</u></a>
          sei, dass so viele Menschen in Berlin ihren Lebensmittelpunkt haben,
          aber nicht wählen dürfen. <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-049-wp.pdf#page=95"><u>Sie
          seien von der Politik betroffen aber hätten kein
          Mitspracherecht.</u></a> Dieses Defizit müsse behoben werden.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD hat den<a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-0989.pdf"><u>
          Antrag</u></a> abgelehnt, da dieser ein „<a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-049-wp.pdf#page=96"><u>direkter
          Angriff auf die Volkssouveränität und unser Grundgesetz</u></a>“ sei.
          Die Fraktion bezeichnet den Antrag als <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-049-wp.pdf#page=96"><u>verfassungswidrig
          und verfassungsfeindlich</u></a>. Wer ein „<a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-049-wp.pdf#page=96"><u>Ausländerwahlrecht</u></a>“
          fordere, beschneide damit das Wahl- und Stimmgewicht deutscher
          Staatsbürger. Der <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-0989.pdf"><u>Antrag</u></a>
          erkläre „<a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-049-wp.pdf#page=96"><u>das
          deutsche Staatsgebiet zu einem Siedlungs- und Herrschaftsgebiet für
          Drittstaatler</u></a>“.
  - id: question-3
    index: 3
    category: Migration
    thesis: >-
      Berlin soll die Einführung der Bezahlkarte mit Bargeldlimit für
      geflüchtete Menschen stoppen.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
      Recherchen, Klagen und Community-Aktionen. Du findest unabhängige,
      investigative Berichterstattung wichtig? <a target="_blank" rel="noopener
