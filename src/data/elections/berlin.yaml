      investigative Berichterstattung wichtig? Entdecke jetzt diese spannende <a
      target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/artikel/exklusiv/2026/08/rechtsbruch-mit-ansage/"><u>Recherche
      zur deutschen Grenzpolitik</u></a>!</p>
    keyword: Asylrecht
    answers:
      - party: cdu
        answer: zu weit
        comment: >-
          Die CDU-Fraktion stimmte gegen den <a target="_blank" rel="noopener
          noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-1050.pdf"><u>Antrag</u></a>
          der Linken mit der Begründung, dass der <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-033-wp.pdf#page=110"><u>EU-Asylkompromiss
