    keyword: Bezahlkarte
    answers:
      - party: cdu
        answer: zu weit
        comment: >-
          Die CDU lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-1748.pdf"><u>Antrag</u></a>
          der Linksfraktion ab. Die Fraktion betonte, dass die Bezahlkarte
          kommen wird und erklärte, <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-089-wp.pdf#page=108">dass
