          <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-089-wp.pdf#page=110"><u>gegen
          eine diskriminierende Bezahlkarte ausgesprochen</u></a>. Die jetzt für
          Berlin geplante Version sei die <a target="_blank" rel="noopener
          noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-089-wp.pdf#page=110"><u>letzte
          einzuführende Bezahlkarte in Deutschland und auch die </u></a>„<a
          target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-089-wp.pdf#page=110"><u>softeste</u></a>“,
          die negativen Auswirkungen auf die Betroffenen sei geringer.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Linksfraktion stimmte für den eigenen <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-1748.pdf"><u>Antrag</u></a>
          und <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-089-wp.pdf#page=109"><u>kritisierte
          die Bezahlkarte in ihrer jetzigen Form als diskriminierend, vor allem
          im Hinblick auf das Bargeldlimit</u></a>. Es gehe mit dieser
          Bezahlkarte darum, abzuschrecken, abzuwerten und auszugrenzen.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Grünen stimmten für den <a target="_blank" rel="noopener
          noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-1748.pdf"><u>Antrag</u></a>
          der Linksfraktion. <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-089-wp.pdf#page=107"><u>Die
          Bezahlkarte sei im Prinzip ein sinnvolles, digitales
          Verwaltungsinstrument, sie kritisierten aber die diskriminierende
          Ausgestaltung der Berliner Bezahlkarte</u></a>. Insbesondere die <a
          target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-089-wp.pdf#page=107">Obergrenze
          von 50 € für Bargeldabhebungen</a> sei problematisch.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD stimmte gegen den <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-1748.pdf"><u>Antrag</u></a>.
          Die Bezahlkarte sei „<a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-089-wp.pdf#page=111"><u>ein
          Asylmagnet, der weiter massenhaft Zuwanderung von Nichtberechtigten
          nach Berlin anziehe</u></a>“. <a target="_blank" rel="noopener
          noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-089-wp.pdf#page=110"><u>Der
          AfD-Fraktion gingen die Einschränkungen der Bezahlkarte nicht weit
          genug.</u></a>
  - id: question-4
    index: 4
    category: Demokratie & Institutionen
    thesis: "Informationsanfragen von Bürger*innen zu\_kritischer Infrastruktur (z. B. Wasser- und Gesundheitsversorgung, ÖPNV, Medien) sollen pauschal abgelehnt werden, auch wenn die Veröffentlichung der Informationen keine konkrete Gefahr für die Sicherheit darstellt."
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat. Seit 15 Jahren setzen wir
      uns für Transparenz ein – mit investigativen Recherchen, Klagen und
      Community-Aktionen. Lies jetzt mehr über die <a target="_blank"
      rel="noopener noreferrer"
      href="https://fragdenstaat.de/artikel/policy/2026/07/ifg-attacke-3/"><u>aktuellen
      Angriffe auf Informationsfreiheit</u></a>.</p>
    keyword: Informationsfreiheit
    answers:
      - party: cdu
        answer: richtig
        comment: >-
          Die CDU stimmte für das <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2999.pdf"><u>Gesetz</u></a>
          zur Änderung des Berliner Datenschutzgesetzes. Die Angriffe auf die
          Energieversorgung hätten gezeigt, dass die kritische Infrastruktur
          gefährdet sei. Transparenz sei kein Selbstzweck, ihr <a
          target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=80">stehe
          die Pflicht des Staates entgegen, die Funktionsfähigkeit seiner
          kritischen Infrastrukturen zu schützen</a> und damit letztlich Leib,
          Leben und die Versorgung der Bevölkerung.
      - party: spd
        answer: richtig
        comment: >-
          Die SPD stimmte für das <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2999.pdf"><u>Gesetz</u></a>
          zur Einschränkung der Informationsfreiheit, da dieses sowohl die <a
          target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=82">Sicherheit
          der kritischen Infrastruktur als auch die Rechte der Bürgerinnen und
          Bürger auf Datenschutz und Informationszugang stärke</a>. Man habe die
          Kritik von FragDenStaat ernst genommen und einige Änderungen am Gesetz
          vorgenommen.
      - party: die-linke
        answer: zu weit
        comment: >-
          Die Linke lehnte das <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2999.pdf"><u>Gesetz</u></a>
          ab, denn es schütze nicht die kritische Infrastruktur. Die Fraktion
          forderte darum <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=83"><u>von
          der Regierung die Umsetzung anderer Maßnahmen wie etwa ein
          Notfallregister für Personen mit Einschränkungen für den
          Katastrophenfall.</u></a> Zudem warf sie der Regierungskoalition vor,
          die Informationsfreiheit abbauen zu wollen und betonte, dass man sich
          stattdessen für ein <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=82"><u>Transparenzgesetz</u></a>
          einsetzen wolle.
      - party: die-gruenen
        answer: zu weit
        comment: >-
          Die Grünen stimmten gegen das <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2999.pdf"><u>Gesetz</u></a>
          zur Änderung des Berliner Datenschutzgesetzes. In der Debatte im
          Fachausschuss konnte laut einem Abgeordneten <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=81">keine
          einzige IFG-Anfrage vorgelegt werden, die den Schutz kritischer
          Infrastruktur gefährde</a>. Das Gesetz sei kein Sicherheitsgesetz,
          sondern ein „<a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=81">Blankoscheck
          für Intransparenz</a>“.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD-Fraktion lehnte das <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2999.pdf"><u>Gesetz</u></a>
          ab. Die Fraktion unterstütze zwar den Schutz kritischer Infrastruktur,
          <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=83">die
          Einschnitte in die Informationsfreiheit und pauschalen
          Bereichsausnahmen bei Informationsfreiheitsanfragen, auch für die
          Steuerverwaltung</a>, gingen jedoch zu weit.
  - id: question-5
    index: 5
    category: Gesellschaft
    thesis: >-
      Die Stadt Berlin soll sich für die Olympischen und Paralympischen Spiele
      bewerben.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern setzt sich mit
      investigativen Recherchen, Klagen und Community-Aktionen für mehr
      Transparenz ein. Du möchtest selbst spannende Informationen über
      Politiker*innen und Behörden ans Licht bringen? <a target="_blank"
      rel="noopener noreferrer"
      href="https://fragdenstaat.de/informationsfreiheit/einsteiger-guide/"><u>Stelle
      jetzt eine IFG-Anfrage!</u></a></p>
    keyword: Olympische Spiele
    answers:
      - party: cdu
        answer: richtig
        comment: >-
          Die CDU stimmte für ihren <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2962-1.pdf">Antrag</a>,
          da sie darin eine „<a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-086-wp.pdf#page=14"><u>enorme
          Chancen für unsere Sportmetropole, für unsere Stadt Berlin</u></a>“,
          etwa in Bezug auf Investitionen in Sportstätten und Infrastruktur,
          sieht.
      - party: spd
        answer: richtig
        comment: >-
          Die SPD stimmte für den <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2962-1.pdf"><u>eigenen
          Antrag</u></a>. Man wollte dem Sport <a target="_blank" rel="noopener
          noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-086-wp.pdf#page=18"><u>mehr
          finanzielle Aufmerksamkeit schenken und die finanzielle Unterstützung
          für Olympia nutzen, um in Berlin Sportanlagen zu sanieren.</u></a>
      - party: die-linke
        answer: zu weit
        comment: >-
          Die Linke lehnte eine <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2962-1.pdf"><u>Bewerbung
          für die Olympischen Spiele</u></a> ab, da man sich diese <a
          target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-086-wp.pdf#page=21"><u>nicht
          leisten könne</u></a>. Die echten <a target="_blank" rel="noopener
          noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-086-wp.pdf#page=20">Kosten
          würden bei solchen Projekten die geplanten deutlich übersteigen</a>
          und die Kostenrechnung der Landesregierung enthalte nicht alle
          anfallenden Kostenpunkte.
      - party: die-gruenen
        answer: zu weit
        comment: >-
          Die Grünen lehnten eine <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2962-1.pdf"><u>Bewerbung
          für Olympia</u></a> ab, mit der Begründung, <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-086-wp.pdf#page=16"><u>dass
          die Stadt Berlin viele andere Probleme habe, die gelöst werden
          müssten</u></a>. Zudem <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-086-wp.pdf#page=17"><u>seien
          die Sportstätten in Berlin in einem schlechten Zustand und die
          Kostenschätzung für das Projekt sei intransparent</u></a>. Gelder für
          Sportanlagen sollten direkt investiert werden, nicht über den Umweg
          über das Olympische Komitee.
      - party: afd
        answer: richtig
        comment: >-
          Die AfD-Fraktion stimmte für den gemeinsamen <a target="_blank"
          rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2962-1.pdf"><u>Antrag</u></a>
          von CDU und SPD. Olympia sei eine Chance <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-086-wp.pdf#page=23"><u>den
          Sanierungsstau der Sportinfrastruktur zu lösen</u></a> und könne <a
          target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-086-wp.pdf#page=22"><u>Menschen
          begeistern und der Stadt ein gemeinsames, endlich positives Ziel
          geben</u></a>.
  - id: question-6
    index: 6
    category: Innere Sicherheit
    thesis: >-
      Die Polizei darf Gesichter im Internet abgleichen, um nach als gefährlich
      geltenden Verdächtigen sowie deren Kontaktpersonen zu suchen. 
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
      Recherchen, Klagen und Community-Aktionen. Du findest unabhängige,
      investigative Berichterstattung wichtig? Entdecke jetzt diese spannende
      Recherche zum <a target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/artikel/exklusiv/2026/02/dobrindt-will-europas-ki-verordnung-verwassern/"><u>KI-Einsatz
      von Sicherheitsbehörden</u></a>!</p>
    keyword: Polizeibefugnisse
    answers:
      - party: cdu
        answer: richtig
        comment: >-
          Die CDU stimmte für den eigenen <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2553.pdf"><u>Antrag</u></a>.
          Das Gesetz mache <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-076-wp.pdf#page=15"><u>die
          liberale Demokratie wehrhaft gegen die bestehenden Gefahren</u></a>
          wie Terrorismus und <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-076-wp.pdf#page=16"><u>solle
          die Sicherheit, Freiheit und körperliche Unversehrtheit der
          Bürger*innen schützen</u></a>.
      - party: spd
        answer: richtig
        comment: >-
          Die SPD hat für das <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2553.pdf"><u>Gesetz
          zur Reform des Berliner Polizei- und Ordnungsrechts</u></a> gestimmt.
          Die Polizei brauche <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-076-wp.pdf#page=10"><u>zeitgemäße
          Instrumente, um ihrer Aufgabe gerecht zu werden</u></a>. Man habe sich
          sehr genau überlegt, <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-076-wp.pdf#page=11"><u>wie
          man das Verhältnis zwischen dem </u></a>„<a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-076-wp.pdf#page=11"><u>Einsatz
          moderner Techniken und der Wahrung von Bürgerrechten</u></a>“
          ausgestaltet.
      - party: die-linke
        answer: zu weit
        comment: >-
          Die Linke lehnte die <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2553.pdf"><u>Polizeireform</u></a>
          entschieden ab, da es <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-076-wp.pdf#page=17"><u>kaum
          noch eine Kontrolle darüber gebe, wer im polizeilichen Datenbestand
          lande und für wie lange</u></a>. Es seien zwar auch <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-076-wp.pdf#page=18"><u>ein
          paar sinnvolle Maßnahmen enthalten, viele würden aber weit über das
          Ziel hinausschießen</u></a>. Das Gesetz bewege sich an der <a
          target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-076-wp.pdf#page=17"><u>Grenze
          des verfassungsrechtlich Zulässigen</u></a> und gehe manchmal auch
          darüber hinaus.
      - party: die-gruenen
        answer: zu weit
        comment: >-
          Die Fraktion der Grünen stimmte gegen den <a target="_blank"
          rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2553.pdf"><u>Gesetzentwurf</u></a>
          von CDU und SPD. Das Gesetz sei ein <a target="_blank" rel="noopener
          noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-076-wp.pdf#page=12"><u>Einfallstor
          für einen Überwachungsstaat</u></a>, insbesondere dann, wenn <a
          target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-076-wp.pdf#page=11"><u>Personen
          überwacht werden, von denen keine Gefahr ausgehe</u></a>, wie etwa
          Kontakt- und Begleitpersonen. Man dürfe nicht im Namen der Sicherheit
          <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-076-wp.pdf#page=12"><u>jeden
          Menschen in Berlin zur Gefahrenquelle erklären</u></a>.
      - party: afd
        answer: richtig
        comment: >-
          Die AfD stimmte für die Reform des <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2553.pdf"><u>Polizei-
          und Ordnungsgesetzes</u></a>. Die Novelle <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-076-wp.pdf#page=18"><u>schaffe
          richtige und längst überfällige Befugnisse für die Sicherheitskräfte,
          sie löse aber nicht das Kriminalitätsproblem der Stadt</u></a>.
          Sicherheit für Berlin bedeute „<a target="_blank" rel="noopener
          noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-076-wp.pdf#page=20"><u>Remigration
          statt illegaler Massenmigration</u></a>“.
