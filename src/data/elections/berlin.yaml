    thesis: >-
      Die Landesregierung soll sich auf EU-Ebene für den Erhalt des Grundrechts
      auf Asyl einsetzen. Asyl-Verfahren sollen nicht an die EU-Außengrenzen
      verlagert werden.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
