          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-033-wp.pdf#page=115">Zustrom
          von Geflüchteten zu begrenzen</a>. Der AfD gehen diese Maßnahmen aber
          noch nicht weit genug.
  - id: question-9
    index: 9
    category: Transparenz
    thesis: >-
      Das Berliner Informationsfreiheitsgesetz soll durch ein Transparenzgesetz
      ersetzt werden. Es soll Behörden verpflichten, wichtige Informationen und
      Dokumente proaktiv, kostenlos und digital zu veröffentlichen.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat. Seit 15 Jahren setzen wir
      uns für Transparenz ein – mit investigativen Recherchen, Klagen und
      Community-Aktionen. Lies jetzt mehr über die <a target="_blank"
      rel="noopener noreferrer"
      href="https://fragdenstaat.de/artikel/policy/2026/07/ifg-attacke-3/"><u>aktuellen
      Angriffe auf Informationsfreiheit</u></a>.</p>
    keyword: Transparenzgesetz
    answers:
      - party: cdu
        answer: zu weit
        comment: >-
          Die CDU-Fraktion lehnte den <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-1014.pdf"><u>Antrag</u></a>
          für ein Berliner Transparenzgesetz ab. Als Gründe nannte die Fraktion
          unter anderem <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=59"><u>den
          Schutz kritischer Bereiche, der im Gesetz nicht ausreichend abgebildet
          sei, sowie hohe Personalkosten bei der Bereitstellung</u></a>.
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD lehnte den Antrag für das <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-1014.pdf"><u>Berliner
          Transparenzgesetz</u></a> in seiner jetzigen Form ab. Das <a
          target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=62"><u>Verhältnis
          von Informationsfreiheit und Sicherheit sei in der vergangenen Zeit
          hin zu mehr Sicherheit verschoben worden</u></a>. Der Gesetzentwurf
          sei „<a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=62"><u>veraltet</u></a>“,
          die SPD kündigte an, einen eigenen Entwurf für ein Transparenzgesetz
          vorzulegen.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Linksfraktion die Linke stimmte für den gemeinsamen <a
          target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-1014.pdf"><u>Antrag</u></a>
          mit den Grünen. Alle, die Informationen erhalten wollen, müssten mit
          einem Transparenzgesetz nicht mehr mühsam Anträge stellen, sondern
          könnten <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=58"><u>diese
          dann zugänglich im Internet finden</u></a>. Dies ermögliche einen
          Paradigmenwechsel in der Informationspolitik des Landes.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Grünen stimmten für den gemeinsamen <a target="_blank"
          rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-1014.pdf"><u>Antrag</u></a>
          mit den Linken, <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=60"><u>da
          das Berliner Transparenzgesetz Ausdruck einer modernen öffentlichen
          Verwaltung sei, die Potenziale und Chancen der Digitalisierung
          nutze.</u></a> Gleichzeitig kritisiert deíe Fraktion die vorgenommenen
          Einschränkungen am Informationsfreiheitsgesetz und fordert mehr statt
          weniger Transparenz.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD-Fraktion lehnte das <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-1014.pdf"><u>Berliner
          Transparenzgesetz</u></a> ab. Man sei nicht gegen Transparenz, doch
          der <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=62"><u>bürokratische
          Aufwand hierfür würde die Verwaltung überfordern und sei damit nicht
          praxistauglich</u></a>.
  - id: question-10
    index: 10
    category: Mobilität
    thesis: >-
      Um den städtischen Raum besser zu nutzen, sollen in Berlin in Zukunft
      weniger private Autos fahren.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern setzt sich mit
      investigativen Recherchen, Klagen und Community-Aktionen für mehr
      Transparenz ein. Du möchtest selbst spannende Informationen über
      Politiker*innen und Behörden ans Licht bringen? <a target="_blank"
      rel="noopener noreferrer"
      href="https://fragdenstaat.de/informationsfreiheit/einsteiger-guide/"><u>Stelle
      jetzt eine IFG-Anfrage</u></a>!</p>
    keyword: Autoverkehr
    answers:
      - party: cdu
        answer: zu weit
        comment: >-
          Die CDU lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-0983.pdf"><u>Antrag</u></a>
          der Fraktionen Bündnis 90/Die Grünen und der Linken ab. Im Gesetz
          seien <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-031-pp.pdf#page=55">viele
          gute Punkte enthalten</a>, aber auch einige, bei denen die CDU nicht
          mitgehen könne. Die CDU wolle keinen „<a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-031-pp.pdf#page=55">Kampf
          gegen das Auto, gegen den motorisierten Individualverkehr
          ausrufen</a>“, so wie es die antragstellenden Parteien laut CDU in das
          Gesetz geschrieben hätten.
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-0983.pdf"><u>Antrag</u></a>
          ab, da er den Individualverkehr zu sehr einschränke. Im Ausschuss
          betonte die SPD, es gebe Verkehrsteilnehmende, <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/AusschussPr/web/web19-022-wp.pdf#page=33">die
          nur mit dem Auto zu ihren systemrelevanten Arbeitsplätzen kommen</a>
          und diese wolle die SPD auch unterstützen, nicht nur den
          Wirtschaftsverkehr.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Fraktion der Linken stimmte dem gemeinsamen <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-0983.pdf"><u>Antrag</u></a>
          mit der Fraktion Bündnis 90/Die Grünen zu. Man müsse den Mut haben, <a
          target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/AusschussPr/web/web19-022-wp.pdf#page=31">den
          privaten motorisierten Individualverkehr teilweise einzuschränken</a>,
          um etwa Unternehmen zu ermöglichen, schneller an ihr Ziel zu kommen
          und Parkplätze zu finden.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Grünen stimmten für den gemeinsamen <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-0983.pdf"><u>Antrag</u></a>.
          Im Ausschuss betonten sie, man müsse sich <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/AusschussPr/web/web19-022-wp.pdf#page=27">für
          eine Reduktion des individuellen privaten Autoverkehrs
          aussprechen</a>, ansonsten würde dies zulasten des Wirtschaftsverkehrs
          gehen. Die Grünen wollten die Straßen vorrangig für die reservieren,
          die tatsächlich auf das Auto angewiesen sind, wie etwa Hebammen,
          Pflegedienste oder Malermeister.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD stimmte gegen den <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-0983.pdf"><u>Antrag</u></a>
          der Grünen und der Linken. Autofahrer würden mit dem Gesetz „<a
          target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-031-pp.pdf#page=60">noch
          weiter gegängelt</a>“, <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-031-pp.pdf#page=59"><u>die
          einzelnen Verkehrsteilnehmer würden gegeneinander ausgespielt</u></a>.
  - id: question-11
    index: 11
    category: Natur & Umwelt
    thesis: >-
      Aufgrund ihrer sozialen und ökologischen Relevanz für Berlin sollen
      landeseigene Kleingärten gesetzlich geschützt werden.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
      Recherchen, Klagen und Community-Aktionen. Du möchtest mehr über unsere
      Projekte zu Klima und Umwelt erfahren? Entdecke jetzt unseren <a
      target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/climate"><u>Climate Helpdesk</u></a>!</p>
    keyword: Kleingärten
    answers:
      - party: cdu
        answer: richtig
        comment: >-
          Die CDU stimmte für das <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-2822.pdf"><u>Gesetz
          zum Erhalt von Kleingartenanlagen</u></a>. Das Landesgesetz würde
          Kleingartenanlagen nun „<a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-081-pp.pdf#page=20"><u>auf
          einem besonderen Niveau</u></a>“ schützen.
      - party: spd
        answer: richtig
        comment: >-
          Die SPD stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-2822.pdf"><u>Gesetz</u></a>
          zum Schutz von Kleingärten zu. Es brauche das
          Kleingärtensicherungsgesetz, da <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-081-pp.pdf#page=16"><u>seit
          1990 ein Drittel der Kleingärten verschwunden sei</u></a>. Mit dem
          bundesweit ersten Sicherungsgesetz für Kleingärten schreibe man
          Geschichte und erhalte so Kleingärten <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-081-pp.pdf#page=16"><u>als
          Orte der Gemeinschaft</u></a>.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Fraktion der Linken stimmte für das <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-2822.pdf"><u>Gesetz</u></a>
          und bezeichnet dieses als „<a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-081-pp.pdf#page=22"><u>Schritt
          in die richtige Richtung, der aber eine Menge Schwächen hat</u></a>“.
          Aus diesem Grund hatten die Linken einen <a target="_blank"
          rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2822-1.pdf"><u>Änderungsantrag</u></a>
          eingereicht, der jedoch abgelehnt wurde. Sie kritisieren, dass die <a
          target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-081-pp.pdf#page=22"><u>Ausnahmeregelungen
          interpretationsoffen seien</u></a> und ein <a target="_blank"
          rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-081-pp.pdf#page=22"><u>einfaches
          öffentliches Interesse ausreiche, um Kleingartenflächen doch zu
          bebauen</u></a>.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Grünen stimmten dem <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-2822.pdf"><u>Gesetz
          zum Erhalt von Kleingartenanlagen</u></a> zu. <a target="_blank"
          rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-081-pp.pdf#page=17"><u>Kleingärten
          sollten dauerhaft gesichert und klimaresilient weiterentwickelt
          werden</u></a>, deshalb begrüßt die Fraktion das Gesetz ausdrücklich.
      - party: afd
        answer: nicht weit genug
        comment: >-
          Die AfD stimmte gegen die <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-2822.pdf"><u>gesetzliche
          Verankerung</u></a> zum Schutz von Kleingärten. Dieses „<a
          target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-081-pp.pdf#page=25"><u>Placebogesetz
          zum Stimmenfang</u></a>“ biete keinen ausreichenden Schutz für die
          Berliner Kleingärten. Die AfD warb für einen eigenen <a
          target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-0543.pdf"><u>Antrag</u></a>,
          der aber abgelehnt worden war.
  - id: question-12
    index: 12
    category: Wirtschaft
    thesis: >-
      Um Ausbildungsplätze zu schaffen, sollen größere Betriebe, die nicht oder
      zu wenig ausbilden, in einen Fonds einzahlen. Betriebe, die ausbilden,
      erhalten aus diesem Fonds einen finanziellen Ausgleich.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
      Recherchen, Klagen und Community-Aktionen. Du findest unabhängige,
      investigative Berichterstattung wichtig? Entdecke jetzt unsere <a
      target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/artikel/exklusiv/2025/11/das-geschaft-mit-den-arbeitslosen/">Community-<u>Recherche</u>
      „Jobcenter-Stories“</a>!</p>
    keyword: Ausbildungsfonds
    answers:
      - party: cdu
        answer: richtig
        comment: >-
          Die CDU stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2552.pdf"><u>Gesetz
          zur Errichtung eines Ausbildungsförderungsfonds</u></a> zu, da der
          Fonds das Ziel hat <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=45"><u>zusätzliche
          Ausbildungsstellen finanziell zu unterstützen</u></a>. Es sei gut,
          dass kleine Betriebe von der Regelung ausgenommen seien und <a
          target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=46"><u>Rahmenbedingungen
          geschaffen werden, um Bürokratie zu verringern</u></a>.
      - party: spd
        answer: richtig
        comment: >-
          Die SPD stimmte dem eigenen <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2552.pdf"><u>Antrag</u></a>
          zu, da durch das Gesetz zusätzliche <a target="_blank" rel="noopener
          noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=44">Ausbildungsplätze
          gefördert und Ausbildungsbetriebe unterstützt</a> würden. Das Gesetz
          in der beschlossenen Form sei ein <a target="_blank" rel="noopener
          noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=44">Kompromiss</a>,
          der aber ausgewogen und tragfähig sei.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Fraktion der Linken stimmte dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2552.pdf"><u>Gesetz</u></a>
          zu, da dieses <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=47"><u>ein
          kleiner Schritt in die richtige Richtung sei</u></a>. Die Linken
          kritisierten aber, <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=48"><u>dass
          bestimmte Ausbildungsbetriebe von der Umlage ausgeschlossen sind und
          fordern für die Zukunft weitere Anpassungen am Gesetz</u></a>.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Fraktion der Grünen stimmte für das <a target="_blank"
          rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2552.pdf"><u>Gesetz</u></a>
          zur Ausbildungsplatzumlage. Es sei grundsätzlich richtig, dass das
          Land Berlin hier handle, auch wenn die <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=45">jetzige
          Fassung nur ein Kompromiss</a> sei. Die Grünen kritisierten, dass <a
          target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=45">Betriebe,
          die ausbilden wollen, es aber nicht können</a>, durch das Gesetz keine
          Unterstützung erhalten. Man begrüße aber, dass kleinsten und kleinen
          Betrieben durch das Gesetz kein Nachteil entstehe.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD stimmte gegen das <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2552.pdf"><u>Gesetz</u></a>,
          da dieses die falsche Antwort auf ein echtes Problem sei. Die Ursache
          für zu wenige Ausbildungsplätze liege am <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=48">Bildungssystem,
          das Schulabgänger ohne ausreichende Grund- und Sprachkenntnisse</a>
          sowie ohne echte Berufsorientierung verabschiede. Dabei bezeichnet die
          Partei die Ausbildungsplatzumlage als „<a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-083-wp.pdf#page=48">Zwangsabgabe</a>“,
          die Betriebe bestrafe.
  - id: question-13
    index: 13
    category: Gesellschaft
    thesis: >-
      Ein neues Gesetz soll lediglich festlegen, unter welchen Bedingungen eine
      Enteignung von privaten Wohnungsunternehmen möglich ist. Der erfolgreiche
      Volksentscheid „Deutsche Wohnen & Co enteignen“ soll vorerst nicht
      umgesetzt werden.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
      Recherchen, Klagen und Community-Aktionen. Du findest unabhängige,
      investigative Berichterstattung wichtig? Entdecke jetzt unsere <a
      target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/recherchen"><u>Recherchen</u></a>!</p>
    keyword: Volksentscheid
    answers:
      - party: cdu
        answer: richtig
        comment: >-
          Die CDU-Fraktion stimmte dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2842.pdf">Antrag</a>
          zu, betonte jedoch, dass dies nur geschehe, um nicht mit dem
          Koalitionsvertrag zu brechen. Inhaltlich positionierte sie sich gegen
          das Gesetz und betont, <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-082-wp.pdf#page=74"><u>dass
          es eine Enteignung oder Vergesellschaftung mit der CDU nicht geben
          werde.</u></a>
      - party: spd
        answer: richtig
        comment: >-
          Die SPD stimmte dem <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2842.pdf">Antrag</a>
          zu. <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-082-wp.pdf#page=73"><u>Eine
          reine Umsetzung des Volksentscheides würde nur wenige Menschen
          betreffen</u></a>, das neue Gesetz ermögliche eine viel
          weitreichendere Änderung für Mieter*innen in Berlin.
      - party: die-linke
        answer: nicht weit genug
        comment: >-
          Die Fraktion der Linken stimmte gegen den <a target="_blank"
          rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2842.pdf">Antrag</a>.
          Das Rahmengesetz sei „<a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-082-wp.pdf#page=75"><u>sinnlos</u></a>“
          und juristisch unnütz. Statt des Rahmengesetzes brauche es vielmehr
          eine tatsächliche <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-082-wp.pdf#page=76"><u>Umsetzung
          des Volksentscheides</u></a>.
      - party: die-gruenen
        answer: nicht weit genug
        comment: >-
          Die Fraktion der Grünen lehnte den <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2842.pdf">Antrag</a>
          ab. Das Rahmengesetz sei „<a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-082-wp.pdf#page=73"><u>überflüssig</u>“<u>
          und </u>„<u>Volksverarsche</u></a>“, vielmehr bedanke man sich bei der
          Initiative „Deutsche Wohnen &amp; Co enteignen“, die einen eigenen
          Gesetzentwurf vorgelegt habe. So wolle man grundsätzliche Probleme auf
          dem Wohnungsmarkt regeln mit dem Ziel eines <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-082-wp.pdf#page=74"><u>gemeinwohlorientierten
          Wohnungsmarktes</u></a>.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD stimmte gegen den <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-2842.pdf">Antrag</a>
          für das Rahmengesetz. Zum einen sei es politisch<a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-082-wp.pdf#page=76"><u>
          verantwortungslos</u></a>, ein Gesetz zu beschließen, bei dem es
          massive verfassungsrechtliche Bedenken gebe. Zum anderen sei das
          Rahmengesetz ein fatales Zeichen an die Wirtschaft,<a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-082-wp.pdf#page=77"><u>
          sodass Investor*innen Berlin verlassen würden</u></a> und der
          Wohnungsbau zum Erliegen käme.
  - id: question-14
    index: 14
    category: Frauen- und Queerpolitik
    thesis: >-
      Das Land Berlin benötigt ein Gesetz, das festlegt, wie Frauen und queere
      Personen vor geschlechtsspezifischer und häuslicher Gewalt geschützt
      werden können.
    info: >-
      <p>FragDenStaat macht nicht nur den Real-O-Mat, sondern auch investigative
      Recherchen, Klagen und Community-Aktionen. Entdecke jetzt, wie wir mit dem
      Gegenrechtsschutz <a target="_blank" rel="noopener noreferrer"
      href="https://fragdenstaat.de/artikel/klagen/2026/06/sachsische-landesregierung-verliert-gegen-den-csd-dresden/"><u>die
      Rechte queerer Menschen gegen autoritäre Behörden verteidigen</u></a>.</p>
    keyword: Gewalthilfegesetz
    answers:
      - party: cdu
        answer: zu weit
        comment: >-
          Die CDU stimmte gegen den <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-3193-1.pdf"><u>Änderungsantrag</u></a>
          von Bündnis 90/Die Grünen und Linken: Das <a target="_blank"
          rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-3193.pdf"><u>Gesetz
          über die Gewalthilfe im Land Berlin</u></a> in seiner jetzigen Form
          bedeute laut CDU nicht, dass es <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-089-pp.pdf#page=94"><u>keine
          Schutzangebote für queere Menschen geben soll</u></a>. Man setze das
          um, was <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-089-pp.pdf#page=94"><u>auf
          Bundesebene für die Frauen vorgegeben ist</u></a>.
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-3193-1.pdf"><u>Änderungsantrag</u></a>
          von Bündnis 90/Die Grünen und den Linken zum Gewalthilfegesetz ab. Sie
          stimmte jedoch gemeinsam mit der CDU dem ursprünglichen Gesetzentwurf
          zu. Das Gewalthilfegesetz sei ein „<a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-089-pp.pdf#page=92"><u>Meilenstein
          im Gewaltschutz</u></a>“. Zu den Rechten queerer Menschen äußerte sich
          die SPD nicht.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Linke stimmte für den <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-3193-1.pdf"><u>Änderungsantrag</u></a>
          und gegen das <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-3193.pdf"><u>Gesetz
          über die Gewalthilfe im Land Berlin</u></a>. Die Fraktion kritisierte,
          dass das neue Gesetz <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-089-pp.pdf#page=94"><u>queeren
          Menschen den ganz realen Schutz verweigern würde</u></a>.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Grünen stimmten für den eigenen <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-3193-1.pdf"><u>Änderungsantrag</u></a>
          aber gegen das <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-3193.pdf"><u>Gesetz
          über die Gewalthilfe im Land Berlin</u></a>. Sie <a target="_blank"
          rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-089-pp.pdf#page=93"><u>begrüßten
          zwar das Gewalthilfegesetz</u></a>, konnten diesem jedoch nicht
          zustimmen. <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-089-pp.pdf#page=93"><u>Queerfeindliche
          Straftaten seien auf dem Höchststand</u></a>, doch das Gesetz gehe
          dieses Problem nicht angemessen an.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD stimmte gegen den <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-3193-1.pdf"><u>Änderungsantrag</u></a>.
          Sie sprach sich aber für das <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/d19-3193.pdf"><u>Gesetz
          über die Gewalthilfe im Land Berlin</u></a> aus. Die Fraktion <a
          target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-089-pp.pdf#page=95"><u>teile
          zwar das grundsätzliche Anliegen</u></a> des Gewalthilfegesetzes, aber
          sehe <a target="_blank" rel="noopener noreferrer"
          href="https://www.parlament-berlin.de/ados/19/IIIPlen/protokoll/plen19-089-pp.pdf#page=96"><u>an
          mehreren Stellen Nachbesserungsbedarf</u></a>. Zum Schutz queerer
          Menschen äußerte sich die AfD-Fraktion nicht.
