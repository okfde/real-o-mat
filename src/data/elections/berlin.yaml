      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Grünen stimmten für den <a target="_blank" rel="noopener
          noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-1050.pdf"><u>Antrag</u></a>
          der Linksfraktion. Man wollte nicht, dass <a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-033-wp.pdf#page=111"><u>Geflüchtete
          an den Grenzen festgehalten werden</u></a>.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD-Fraktion stimmte gegen den <a target="_blank" rel="noopener
          noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-1050.pdf"><u>Antrag</u></a>
