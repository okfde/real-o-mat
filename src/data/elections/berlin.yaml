      - party: spd
        answer: zu weit
        comment: >-
          Die SPD lehnte den <a target="_blank" rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/DruckSachen/d19-1748.pdf"><u>Antrag</u></a>
          der Linken ab. Die Fraktion sieht die Bezahlkarte zwar sehr kritisch,
          da laut Exper*tinnen eine Bezahlkarte „<a target="_blank"
          rel="noopener noreferrer"
          href="https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/PlenarPr/p19-089-wp.pdf#page=110"><u>ökonomisch,
          teilhabepolitisch, verwaltungs- als auch steuerungstechnisch absolut
