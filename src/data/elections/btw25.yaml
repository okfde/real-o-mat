          href="https://dserver.bundestag.de/btd/20/014/2001409.pdf">Gesetzentwurf</a>
          für das Bundeswehr Sondervermögen sowie den <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/014/2001410.pdf">Gesetzentwurf</a>
          zur Grundgesetzänderung ab. Sie kritisiert die geplante Änderung am
          Grundgesetz. Eine verbesserte Finanzierung der Bundeswehr sei, laut
          AfD, auch <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/020/2002091.pdf">ohne eine
          Grundgesetzänderung</a> möglich.
  - id: question-10
    index: 10
    category: Verteidigung
    thesis: >-
      Deutschland soll das weitreichende Waffensystem Taurus an die Ukraine
      liefern.
    answers:
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/091/2009143.pdf">Antrag</a>
          ab. Deutschland liefere nicht nur Waffen, sondern unterstütze die
          Ukraine auch humanitär, finanziell und entwicklungspolitisch. Die
          Lieferung des Taurus kreiere Lücken in der eigenen Verteidigung, und
          der Einsatz des Systems etwa für Angriffe auf russischem Boden könne
          den Krieg noch weiter eskalieren lassen. Die Verengung der Debatte zur
          Unterstützung der Ukraine auf Waffenlieferungen <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20157.pdf#P.20087">kritisiert
          die Fraktion scharf.</a>
      - party: cdu-csu
        answer: richtig
        comment: >-
          Die Unionsfraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/091/2009143.pdf">Antrag</a>
          zu. Eine schnelle Lieferung des Taurus-Marschflugkörpers schaffe eine
          bessere Verteidigungsfähigkeit und neue <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20157.pdf#P.20086">Dynamik
          im Ukrainekrieg</a>. Nationale Versorgungslücken will sie im
          Nachhinein <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/100/2010053.pdf">auffüllen</a>.
      - party: fdp
        answer: /
        comment: >-
          Die FDP-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/091/2009143.pdf">Antrag</a>
          ab. Allerdings spricht sie sich in den <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20146.pdf#P.18544">jeweiligen
          Plenardebatten </a>inhaltlich für die Lieferung der
          Taurus-Marschflugkörper aus. Darum ist die Position hier nicht
          wertbar. Es brauche jedoch dafür nicht unzählige Anträge der
          Opposition, die sie als „<a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20157.pdf#P.20091">Spiele“</a>
          bezeichnet und keine Debatte auf dem Rücken deutscher Soldat*innen,
          sondern Einigkeit, um das System schnellstmöglich zu liefern. Darüber
          hinaus fordert sie, die Bundeswehr <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btp/20/20146.pdf#P.18544">finanziell
          besser auszustatten</a> und für junge Menschen attraktiver zu machen.
      - party: die-gruenen
        answer: /
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN lehnt den <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/091/2009143.pdf">Antrag</a>
          ab. In der <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20157.pdf#P.20085">Plenardebatte</a>
          sprechen sich Fraktionsvertreter*innen dennoch für die Lieferung der
          Taurus-Marschflugkörper aus. Darum ist die Position hier nicht
          wertbar. Sie bezeichnen die Anträge der Unionsfraktion jedoch als
          „Schauanträge&quot; und sehen die Lösung der Frage beim
          Bundessicherheitsrat.
      - party: bsw
        answer: zu weit
        comment: >-
          Die Gruppe BSW lehnt den <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/091/2009143.pdf">Antrag</a>
          ab und stellt sich kategorisch gegen die Lieferung der
          Taurus-Marschflugkörper. Die<a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btp/20/20146.pdf#P.18546"> Ukraine
          könne den Krieg nicht gewinnen</a> und die Taurus-Lieferung sei ein
          kriegstreiberisches Begehren, das Deutschland in den <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20157.pdf#P.20097">Augen
          Russlands zur Kriegspartei</a> machen könne.
      - party: die-linke
        answer: zu weit
        comment: >-
          Die Gruppe Die Linke lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/091/2009143.pdf">Antrag</a>
          ab. Sie fordert in der <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20157.pdf#P.20095">Plenardebatte</a>
          stattdessen Verhandlungen und friedenspolitische Strategien, um den
          Krieg in der Ukraine zu beenden.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/091/2009143.pdf">Antrag</a>
          ab. Die Lieferung der Taurus-Marschflugkörper schade Deutschland und
          könne das Land in den Augen Russlands zur Kriegspartei machen.
          Stattdessen brauche es sofortige <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btp/20/20157.pdf#P.20094">Friedensgespräche</a>.
  - id: question-11
    index: 11
    category: Migration
    thesis: >-
      Die Bundesregierung soll sich für den Erhalt des individuellen Rechts auf
      Asyl in der EU aussprechen.
    answers:
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/069/2006902.pdf">Antrag</a>
          ab und <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20109.pdf#P.13198">weist die
          Kritik zurück,</a> das individuelle Asylrecht werde durch die
          GEAS-Reform ausgehöhlt. Stattdessen schaffe man damit rechtliche
          Mindeststandards sowie Mindeststandards für menschenwürdige
          Aufnahmebedingungen, um <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20109.pdf#P.13219">Zustände
          in Lagern wie im Flüchtlingslager Moria zu vermeiden</a>.
      - party: cdu-csu
        answer: zu weit
        comment: >-
          Die Unionsfraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/069/2006902.pdf">Antrag</a>
          ab. Sie kritisiert nicht nur diesen Antrag, sondern bezeichnen
          Deutschlands Position in den EU-Verhandlung <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20109.pdf#P.13207">als nicht
          weit genug</a> und fordert weitere Maßnahmen. Dabei spricht sie sich
          z.B. dagegen aus, Familien mit Kindern aus dem Kompromiss
          herauszuhandeln, da dies falsche Anreize setzen könne, um mit Kindern
          nach Europa zu fliehen.
      - party: fdp
        answer: zu weit
        comment: >-
          Die FDP-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/069/2006902.pdf">Antrag</a>
          ab. Sie <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20109.pdf#P.13206">widerspricht</a>
          der Annahme im Antrag, dass faktisch das Asylrecht abgeschafft werden
          solle. Stattdessen sei die europäische Einigung richtig und
          wirkungsvoll.
      - party: die-gruenen
        answer: zu weit
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN lehnt den <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/069/2006902.pdf">Antrag</a>
          ab. Zwar sei sie <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20109.pdf#P.13203">besorgt
          über haftähnliche Bedingungen an den Außengrenzen</a> durch die
          GEAS-Reform und ist mit dem Ergebnis der europäischen Einigung nicht
          zufrieden, sie betont aber dennoch die Notwendigkeit einer Einigung,
          auch unter diesen Vorbehalten. Die Fundamentalopposition der Linken
          sei in diesem Fall zu <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20109.pdf#P.13210">bequem</a>.
      - party: bsw
        answer: /
        comment: >-
          Die Gruppe BSW war zu diesem Zeitpunkt noch nicht im Deutschen
          Bundestag vertreten.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Fraktion Die Linke stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/069/2006902.pdf">Antrag</a>
          zu. Die Fraktion sieht in der europäischen Asylreform die <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20109.pdf#P.13205">faktische
          Abschaffung des Grundrechts auf Asyl</a> und einen Angriff auf die
          Rechte Schutzsuchender, besonders durch die Ausweitung der
          Drittstaatenregelung und die Möglichkeit, auch Familien mit Kindern
          vorübergehend in Grenzeinrichtungen festzuhalten. Die Bundesregierung
          breche damit ihr Versprechen aus dem Koalitionsvertrag, das Leid an
          den Außengrenzen zu beenden.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/069/2006902.pdf">Antrag</a>
          ab. Sie halte die Maßnahmen der EU für hochgradig ineffektiv und setzt
          sich in der Debatte <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20109.pdf#P.13219">für noch
          schärfere Mechanismen ein</a>, darunter auch die Internierung
          Minderjähriger zum Zweck der Durchführung von Grenzverfahren an den
          Außengrenzen und die Rückführung aller Syrer*innen in das damals noch
          vom Assad-Regime geführte Syrien.
  - id: question-12
    index: 12
    category: Migration
    thesis: >-
      Anerkannte Schutzberechtigte sollen ihren Status verlieren, wenn sie in
      ihre Heimat reisen.
    answers:
      - party: spd
        answer: richtig
        comment: >-
          Die SPD-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/128/2012805.pdf">Gesetzentwurf</a>
          zu.
      - party: cdu-csu
        answer: nicht weit genug
        comment: >-
          Die Unionsfraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/128/2012805.pdf">Gesetzentwurf</a>
          ab. Sie stimmt zu, dass Heimreisen von Schutzberechtigten zum Verlust
          ihres Status führen sollen. Dass jedoch Ausnahmen davon vorgesehen
          sind, wie z.B. der Besuch einer Beerdigung, sei <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/134/2013413.pdf">realitätsfern</a>.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/128/2012805.pdf">Gesetzentwurf</a>
          zu. Man schaffe damit im Bereich der Migration einen weiteren
          wichtigen Schritt hin zu mehr Ordnung und Kontrolle. Es werde
          klargestellt, dass Schutzsuchende, die ohne zwingenden Grund in ihr
          Heimatland zurückkehren, ihren Schutzstatus verlieren, da solche <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20185.pdf#P.24079">Reisen
          dem Grund widersprächen</a>, weshalb der Schutz überhaupt gewährt
          wurde.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN stimmt dem <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/128/2012805.pdf">Gesetzentwurf</a>
          zu.
      - party: bsw
        answer: nicht weit genug
        comment: >-
          Die Gruppe BSW lehnt den <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/128/2012805.pdf">Gesetzentwurf</a>
          ab. Sie betont zwar, dass es richtig sei, dass Menschen, die Urlaub im
          Land machen, aus dem sie geflohen sind, keinen Anspruch auf Schutz
          haben, jedoch müsse man zusätzlich <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btp/20/20185.pdf#P.23988">Grenzbehörden
          anweisen</a>, relevante Ausreisen an die Ausländerbehörden zu melden.
      - party: die-linke
        answer: zu weit
        comment: >-
          Die Gruppe die Linke lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/128/2012805.pdf">Gesetzentwurf</a>
          ab. Sie bezeichnet das Sicherheitspaket als Symbolpolitik. Zwar müsse
          man über Migrationspolitik sprechen, jedoch ohne <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20185.pdf#P.23986">Migrant*innen
          zum Sicherheitsrisiko</a> zu erklären.
      - party: afd
        answer: nicht weit genug
        comment: >-
          Die AfD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/128/2012805.pdf">Gesetzentwurf</a>
          ab. Wer aus einer<a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/134/2013413.pdf">
          Bedrohungslage zurückreise</a>, habe jeglichen Schutz verwirkt.
          Dennoch habe die Bundesregierung weitergehende Schritte, etwa die
          Einführung eines elektronischen Grenzsystems, versäumt.
  - id: question-13
    index: 13
    category: Mobilität
    thesis: >-
      Das Deutschlandticket für den öffentlichen Nahverkehr soll deutlich
      weniger als 49 Euro im Monat kosten.
    answers:
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/025/2002575.pdf">Antrag</a>
          ab. Zwar wäre das 9-Euro-Ticket ein Erfolg gewesen, insbesondere um
          Bürger*innen finanziell zu entlasten, doch dürfe man jetzt jedoch
          keine <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/058/2005886.pdf">voreilige
          Entscheidung</a> treffen. Es brauche noch Zeit, um sich mit den
          Ländern über die Einführung eines Nachfolgetickets zu einigen.
      - party: cdu-csu
        answer: zu weit
        comment: >-
          Die Unionsfraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/025/2002575.pdf">Antrag</a>
          ab. Es habe<a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/058/2005886.pdf"> keine
          nachhaltigen Umsteigeffekte</a> auf den Nahverkehr durch das
          9-Euro-Ticket gegeben. Zudem würde eine schlichte staatliche
          Subventionierung zu einer Kostenspirale führen, nicht zu tatsächlichen
          Verbesserungen der Situation im Nahverkehr.
      - party: fdp
        answer: zu weit
        comment: >-
          Die FDP-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/025/2002575.pdf">Antrag</a>
          ab. Man habe mit dem 9-Euro-Ticket <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/058/2005886.pdf">eine akute
          Hilfe</a> stellen wollen. Auf Dauer sei ein nicht kostendeckendes
          Ticket jedoch nicht sinnvoll, da gerade der nötige Ausbau des ÖPNV
          sowie gestiegene Personal- und Energiekosten Geld koste.
      - party: die-gruenen
        answer: zu weit
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN lehnt den <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/025/2002575.pdf">Antrag</a>
          ab. Zwar gingen viele Forderungen in die richtige Richtung, <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/058/2005886.pdf">man fürchte
          jedoch</a>, dass sehr günstige Ticketpreise die Länder dazu zwingen
          könnten, den Verkehr einzuschränken.
      - party: bsw
        answer: /
        comment: >-
          Die Gruppe BSW war zu diesem Zeitpunkt noch nicht im Deutschen
          Bundestag vertreten.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Fraktion Die Linke stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/025/2002575.pdf">Antrag</a>
          zu. Sie betont den durchschlagenden Erfolg des 9-Euro-Tickets und
          sieht den Antrag als richtigen Weg in Richtung eines <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/058/2005886.pdf">kostenfreien
          Nahverkehrs</a>.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/025/2002575.pdf">Antrag</a>
          ab. Die Verwendung von Steuergeldern für verbilligte Tickets sei nicht
          gerechtfertigt. Das Geld werde vielmehr<a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/058/2005886.pdf"> für den
          Ausbau des ÖPNV</a> auf dem Land benötigt.
  - id: question-14
    index: 14
    category: Bildung
    thesis: >-
      Die BAföG-Sätze für Schüler*innen und Studierende sollen um 5 Prozent beim
      Grundbedarf bzw. 20 Euro beim Wohngeld angehoben werden.
    answers:
      - party: spd
        answer: richtig
        comment: >-
          Die SPD-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/113/2011313.pdf">Gesetzentwurf</a>
          zu. Mit der Ausweitung des BAföG-Anspruchs und dem
          Flexibilisierungssemsters würden mehr junge Menschen besser gefördert.
          Das neue Gesetz sei zudem <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/118/2011815.pdf">gerechter
          und krisenfester</a>.
      - party: cdu-csu
        answer: nicht weit genug
        comment: >-
          Die Unionsfraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/113/2011313.pdf">Gesetzentwurf</a>
          ab. Er sei weder die angekündigte große strukturelle Reform, <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/118/2011815.pdf">noch reiche
          die Erhöhung der Sätze</a> angesichts der Inflation und gestiegen
          Mietpreise aus.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/113/2011313.pdf">Gesetzentwurf</a>
          zu. Faire <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/118/2011815.pdf">Bildungschancen
          unabhängig von finanziellen Mitteln</a> der Eltern seien zentral für
          die Zukunft junger Menschen und die wirtschaftliche Leistungsfähigkeit
          Deutschlands. Sie begrüßt auch, dass Änderungen nicht nur die
          Förderung der akademischen Laufbahn betreffen, sondern auch das Schul-
          und Aufstiegs-BAföG.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN stimmt dem <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/113/2011313.pdf">Gesetzentwurf</a>
          zu. Die Einführung der Studienstarthilfe und die Möglichkeit eines
          flexiblen Fachrichtungswechsels seien <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/118/2011815.pdf">ein
          wichtiger Fortschritt</a>. Trotz der Erhöhung der Sätze seien aber
          weitere Maßnahmen, insbesondere mit Blick auf den angespannten
          Mietmarkt, nötig.
      - party: bsw
        answer: nicht weit genug
        comment: >-
          Die Gruppe BSW lehnt den <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/113/2011313.pdf">Gesetzentwurf</a>
          ab. Er würde keine grundlegenden Veränderungen für Studierende oder <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/118/2011815.pdf">Bildungsgerechtigkeit
          bringen</a>, denn die geplante Erhöhung der Bedarfssätze sei
          angesichts der gestiegenen Lebenshaltungskosten unzureichend.
      - party: die-linke
        answer: nicht weit genug
        comment: >-
          Die Gruppe Die Linke lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/113/2011313.pdf">Gesetzentwurf</a>
          ab. Er liefere nicht die von der Koalition angekündigte
          Strukturreform, die angesichts der überdurchschnittlich <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/118/2011815.pdf">hohen
          Armutsquote unter Studierenden</a> längst überfällig sei.
      - party: afd
        answer: nicht weit genug
        comment: >-
          Die AfD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/113/2011313.pdf">Gesetzentwurf</a>
          ab. Sie fordert <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/118/2011815.pdf">Nachbesserungen</a>,
          insbesondere bei den Bedarfssätzen, dem Kinderbetreuungszuschlag und
          der Flexibilität der Regelstudienzeit.
  - id: question-15
    index: 15
    category: Finanzen
    thesis: >-
      In nationalen Notlagen soll die im Grundgesetz verankerte Schuldenbremse
      ausgesetzt werden.
    answers:
      - party: spd
        answer: richtig
        comment: >-
          Die SPD-Koalition stimmt den Anträgen vom <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/005/2000505.pdf">Januar
          2022</a> und <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/095/2009501.pdf">November
          2023</a> zu. Erst die Corona-Pandemie, dann der Krieg in der Ukraine
          und die Hochwasserkatastrophe im Ahrtal hätten es notwendig gemacht,
          die <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/096/2009676.pdf">Schuldenbremse
          wegen nationaler Notlagen</a> auszusetzen.
      - party: cdu-csu
        answer: zu weit
        comment: >-
          Die Unionsfraktion lehnt die Anträge vom <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/005/2000505.pdf">Januar
          2022</a> und <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/095/2009501.pdf">November
          2023</a> ab und kritisiert in den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/097/2009776.pdf">Entschließungsanträgen</a>
          die Aussetzung der Schuldenbremse als verfassungswidrig. Die
          Begründungen der Notlage seien kaum haltbar.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP-Fraktion stimmt den Anträgen vom <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/005/2000505.pdf">Januar
          2022</a> und <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/095/2009501.pdf">November
          2023</a> zu, etwa um die internationale <a target="_blank"
          rel="noopener noreferrer"
          href="https://www.bundestag.de/dokumente/textarchiv/2022/kw04-de-nachtragshaushaltsgesetz-877110">Wettbewerbsfähigkeit</a>
          während der Pandemie zu stärken. Zwar sei die Fraktion <a
          target="_blank" rel="noopener noreferrer"
          href="https://www.bundestag.de/dokumente/textarchiv/2023/kw49-pa-haushalt-980524">2023
          unzufrieden</a> über die Aussetzung der Schuldenbremse, dies wäre
          jedoch notwendig, um sich mit den beiden anderen Ampelfraktionen zu
          einigen.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN stimmt den Anträgen <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/005/2000505.pdf">vom Januar
          2022</a> und <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/095/2009501.pdf">November
          2023</a> zu. Erst die Corona-Pandemie, später auch der Krieg in der
          Ukraine und die Hochwasserkatastrophe im Ahrtal hätten es notwendig
          gemacht, die <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/096/2009676.pdf">Schuldenbremse
          wegen nationaler Notlagen</a> auszusetzen.
      - party: bsw
        answer: /
        comment: >-
          Die Gruppe BSW war zu diesem Zeitpunkt noch nicht im Deutschen
          Bundestag vertreten.
      - party: die-linke
        answer: nicht weit genug
        comment: >-
          Die Fraktion Die Linke lehnt den Antrag im <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/005/2000505.pdf">Januar
          2022</a> ab und fordert stattdessen in einem <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/004/2000486.pdf">Entschließungsantrag</a>
          einen Gesetzentwurf zur Anpassung der Schuldenbremse. Obwohl die
          Mehrheit der Fraktionslosen im <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/095/2009501.pdf">Dezember
          2023</a> für die Aussetzung der Schuldenbremse stimmte, wurde die
          Position der Linken insgesamt als &quot;nicht weit genug&quot;
          gewertet, da die Gruppe die Schuldenbremse grundsätzlich ablehnt.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD-Fraktion lehnt die Anträge vom <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/005/2000505.pdf">Januar 2022
          </a>und <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/095/2009501.pdf">November
          2023</a> ab. Die jeweiligen Anträge zum Nachtragshaushalt sprengen die
          Grenzen des Grundgesetzes und die Begründungen für die Überschreitung
          der Schuldengrenze - Konjunkturbelebung, Ukrainekonflikt,
          Flutkatastrophe  - seien nicht legitim, so die AfD in den
          Entschließungsanträgen <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/004/2000488.pdf">20/488</a>
          und <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/097/2009775.pdf">20/9775</a>.
  - id: question-16
    index: 16
    category: Finanzen
    thesis: >-
      Um gesellschaftliche Herausforderungen zu bewältigen, sollen die
      vermögendsten Privatpersonen und Unternehmen einmalige Sonderabgaben
      leisten.
    answers:
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD-Fraktion lehnt den ersten <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/018/2001849.pdf">Antrag</a>
          und den zweiten <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/043/2004307.pdf">Antrag</a>
          ab. Die Abschöpfung der Extragewinne von Energiekonzernen stehe im <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/096/2009676.pdf">Widerspruch
          zu den Prinzipien der Sozialen Marktwirtschaft</a>. Sie fordert
          stattdessen eine <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20066.pdf#P.7558">gerechtere
          Besteuerung von Vermögen und Erbschaften</a>, um die soziale
          Ungleichheit zu verringern. Die SPD unterstütze grundsätzlich eine
          Vermögensabgabe, lehnt sie jedoch aufgrund politischer Realitäten in
          der Koalition ab und fordert kreative Lösungen zur Eindämmung von
          Übergewinnen, um soziale Gerechtigkeit und die Krisenbewältigung zu
          fördern.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Fraktion Die Linke stimmt dem ersten <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/018/2001849.pdf">Antrag</a>
          und dem zweiten <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/043/2004307.pdf">Antrag</a>
          zu. Sie betont, dass eine Übergewinnsteuer rechtlich möglich sei und
          nach einem Vorschlag der EU-Kommission erstellt worden sei, der es
          Mitgliedstaaten<a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/024/2002450.pdf">
          ermögliche, Zufallsgewinne von Energieunternehmen</a> abzuschöpfen.
          Eine Vermögensabgabe sei zudem angesichts der <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20066.pdf#P.7550">angespannten
          finanziellen Lage durch die Corona-Pandemie,</a> Energiekrise und den
          Krieg in der Ukraine notwendig, um Umverteilung und finanzielle
          Gerechtigkeit zu schaffen.
      - party: cdu-csu
        answer: zu weit
        comment: >-
          Die Unionsfraktion lehnt den ersten <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/018/2001849.pdf">Antrag</a>
          und den zweiten <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/043/2004307.pdf">Antrag</a>
          ab. Es gäbe <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20066.pdf#P.7558">verfassungsrechtliche
          Bedenken</a> und praktische Probleme. Auch die zeitliche Abgrenzung
          seien zu unkonkret und undetailliert hinsichtlich Steuersatz,
          Freibeträge oder Geltungsbereich problematisch.
      - party: fdp
        answer: zu weit
        comment: >-
          Die FDP-Fraktion lehnt den ersten <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/018/2001849.pdf">Antrag</a>
          und den zweiten <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/043/2004307.pdf">Antrag</a>
          ab. Eine Übergewinnsteuer könne zu Fehlanreizen führen, die
          Geschäftsaktivitäten gefährden könnten. Zudem gäbe es <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/024/2002450.pdf">verfassungsrechtliche
          Bedenken</a>. Auch eine Vermögenssteuer schaffe Rechtsunsicherheit.
          Stattdessen ginge es vielmehr darum, <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btp/20/20066.pdf#P.7556">Investitionsanreize
          zu setzen</a>.
      - party: die-gruenen
        answer: zu weit
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN lehnt den ersten <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/018/2001849.pdf">Antrag</a>
          und den zweiten <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/043/2004307.pdf">Antrag</a>
          ab. Eine Übergewinnsteuer könne eine <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/024/2002450.pdf">Übergangslösung</a>
          gegen die vorherrschenden oligopolistischen Strukturen auf dem
          Energiemarkt sein, doch es gäbe noch zu klärende Rechtsfragen. Zwar
          freue sich die Fraktion, das über Vermögensungleichheit diskutiert
          würde, es gäbe jedoch <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20066.pdf#P.7555">innerhalb
          der Koalition keinen Konsens</a> über eine Vermögensabgabe.
      - party: bsw
        answer: /
        comment: >-
          Die Gruppe BSW war zu diesem Zeitpunkt noch nicht im Deutschen
          Bundestag vertreten.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD-Fraktion lehnt den ersten <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/018/2001849.pdf">Antrag</a>
          und den zweiten <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/043/2004307.pdf">Antrag</a>
          ab. Eine Übergewinnsteuer führe nur dazu, Gewinne in die Staatskasse
          zu lenken, <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/024/2002450.pdf">ohne den
          privaten Haushalten</a> zugute zu kommen. Die Strompreisschwankungen
          gingen dabei auf eine verfehlte Energiepolitik zurück. Zudem brauche
          es keine Vermögensabgabe. Der Staat <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btp/20/20066.pdf#P.7555">erziele
          bereits hohe Steuereinnahmen</a> und habe kein Einnahme- sondern ein
          Ausgabeproblem, etwa durch hohe Kosten, die ungesteuerte Migration
          verursache.
  - id: question-17
    index: 17
    category: Wirtschaft
    thesis: >-
      Das deutsche Lieferkettengesetz zum Schutz von Menschenrechten und der
      Umwelt in globalen Lieferketten soll ausgesetzt werden.
    answers:
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/117/2011752.pdf">Gesetzentwurf
          </a>ab. Mit dem Lieferkettengesetz sei Deutschland zum Vorreiter
          geworden, um Menschenrechte international zu stärken soll. Eine
          Aussetzung würde zu einem internationalen Glaubwürdigkeitsverlust
          führen und <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/130/2013044.pdf">sei nicht
          zielführend</a>.
      - party: die-linke
        answer: zu weit
        comment: >-
          Die Gruppe Die Linke lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/117/2011752.pdf">Gesetzentwurf</a>
          ab. Eine Aufhebung des deutschen Lieferkettengesetzes ohne
          beschleunigte Umsetzung der europäischen Richtlinien führe zu einem <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/130/2013044.pdf">bürokratischen
          Chaos und einem rechtsfreien Raum</a>, was gesetzestreue Unternehmen
          benachteilige.
      - party: cdu-csu
        answer: richtig
        comment: >-
          Die Unionsfraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/117/2011752.pdf">Gesetzentwurf</a>
          zu. Angesichts der schwierigen Wirtschaftslage müsse das deutsche
          Lieferkettengesetz ausgesetzt werden, um <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/130/2013044.pdf">Unternehmen
          von Bürokratie zu entlasten</a>, bis eine bürokratiearme Lösung
          inkraft tritt.
      - party: fdp
        answer: zu weit
        comment: >-
          Die FDP-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/117/2011752.pdf">Gesetzentwurf</a>
          ab. Da bereits Berichtspflichten aus dem deutschen Lieferkettengesetz
          für Unternehmen aufgehoben würden, mache dies die<a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/130/2013044.pdf"> Aussetzung
          des Gesetzes zum Bürokratieabbau obsolet.</a>
      - party: die-gruenen
        answer: zu weit
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN lehnt den <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/117/2011752.pdf">Gesetzentwurf</a>
          ab. Das deutsche Lieferkettengesetz <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/130/2013044.pdf">habe nicht
          zur schwierigen Wirtschaftslage</a> beigetragen. Die Berichtspflichten
          des Gesetzes seien zwar sehr bürokratisch, aber eine bürokratiearme
          Ausgestaltung der kommenden EU-Richtlinien würde die Unternehmen
          wieder entlasten.
      - party: bsw
        answer: zu weit
        comment: >-
          Die Gruppe BSW lehnt den <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/117/2011752.pdf">Gesetzentwurf</a>
          ab. Das Lieferkettengesetz sei nicht für die anhaltende Rezession der
          deutschen Wirtschaft verantwortlich. Außerdem <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/130/2013044.pdf">dürfe der
          Schutz der Menschenrechte</a> in den Lieferketten nicht von der
          konjunkturellen Lage abhängig gemacht werden.
      - party: afd
        answer: richtig
        comment: >-
          Die AfD-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/117/2011752.pdf">Gesetzentwurf</a>
          zu. Das Lieferkettengesetz <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/130/2013044.pdf">erschwere
          das Geschäft deutscher Unternehmen</a> in Schwellenländern. Auch eine
          europäische Regelung müsse aufgehoben werden, da sie die
          Wettbewerbstätigkeiten europäischer Unternehmen einschränke.
  - id: question-18
    index: 18
    category: Energie
    thesis: >-
      Für besseren Klimaschutz soll jede neu installierte Heizung in
      Neubaugebieten zu mindestens 65 Prozent mit erneuerbaren Energien
      betrieben werden.
    answers:
      - party: spd
        answer: richtig
        comment: >-
          Die SPD-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/068/2006875.pdf">Gesetzentwurf</a>
          zu. Er sei ein <a target="_blank" rel="noopener noreferrer"
          href="https://www.spdfraktion.de/system/files/documents/position-bezahlbares-wohnen-zukunftsgerechtes-bauen.pdf">wichtiger
          Beitrag zur Erreichung der Klimaziele und zur Energiewende</a>. Die
          verpflichtende Nutzung erneuerbarer Energien bei Neubauten sei eine
          zentrale Maßnahme, um die CO₂-Emissionen im Gebäudebereich deutlich zu
          reduzieren.
      - party: cdu-csu
        answer: zu weit
        comment: >-
          Die Unionsfraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/068/2006875.pdf">Gesetzentwurf</a>
          ab. Sie unterstütze das Ziel, klimaneutral zu heizen, allerdings
          machen die Ampelfraktionen im Gesetzentwurf keine Angaben zur genauen
          CO2-Einsparung, die notwendig wären, um die vorgeschlagenen <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/076/2007619.pdf">Eingriffe
          in die Eigentumsrechte der Bürger*innen zu legitimieren</a>.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/068/2006875.pdf">Gesetzentwurf</a>
          zu. Das Gesetz sei <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/076/2007619.pdf">praktikabel,
          bezahlbar und technologieoffen</a> und eine Weichenstellung für die
          Klimaneutralität im Gebäudebereich.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN stimmt dem <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/068/2006875.pdf">Gesetzentwurf</a>
          zu. Er <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/076/2007619.pdf">verringere
          die Abhängigkeit von fossilen Energien</a> und ermögliche verschiedene
          Optionen und Kombinationen für die Wärmeversorgung.
      - party: bsw
        answer: /
        comment: >-
          Die Gruppe BSW war zu diesem Zeitpunkt noch nicht im Deutschen
          Bundestag vertreten.
      - party: die-linke
        answer: zu weit
        comment: >-
          Die Gruppe Die Linke lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/068/2006875.pdf">Gesetzentwurf</a>
          ab. Sie kritisiert die <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/076/2007619.pdf">unzureichende
          Unterstützung von Mieter*innen und selbstnutzenden
          Wohneigentümer*innen</a>. Die Förderung für Sanierungskosten sei nicht
          ausreichend.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/068/2006875.pdf">Gesetzentwurf</a>
          ab. Erst wenn es konkrete Pläne für die kommunale Wärmeplanung gäbe,
          <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/076/2007619.pdf">könne man
          Bürger*innen verpflichten, sich an diese anzupassen</a>. Zudem müssten
          die notwendigen Sanierungsmaßnahmen zum größten Teil von den
          Bürger*innen selbst getragen werden.
  - id: question-19
    index: 19
    category: Landwirtschaft
    thesis: >-
      Mit der Subventionierung von Agrardiesel sollen Landwirtschaftsbetriebe
      weiter entlastet werden.
    answers:
      - party: spd
        answer: /
        comment: >-
          Die SPD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/100/2010050.pdf">Antrag
          </a>ab. Die SPD betonte in der <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btp/20/20147.pdf#P.18614">Bundestagsdebatte</a>,
          dass man mit den Landwirten im Gespräch sei. Es gehe den Landwirten um
          mehr als die Abschaffung der Agrardieselsubventionen und verwies auf
          das Agrarpaket zur Entlastung der Landwirtschaft. Dabei positioniert
          die Partei sich in der Debatte zu diesem Antrag aber nicht explizit
          zum Agrardiesel, darum gilt die Positionierung der SPD in Bezug auf
          Agrardiesel als nicht bewertbar.
      - party: cdu-csu
        answer: richtig
        comment: >-
          Die Unionsfraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/100/2010050.pdf">Antrag</a>
          zu. Die Steuerreduzierung beim Agrardiesel<a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20147.pdf#P.18619"> sei eine
          gerechte Maßnahme</a>, um die landwirtschaftliche Produktion
          aufrechtzuerhalten.
      - party: fdp
        answer: zu weit
        comment: >-
          Die FDP-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/100/2010050.pdf">Antrag
          </a>ab. Man habe <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20147.pdf#P.18616">Sparvorhaben
          für die Landwirtschaft</a> bereits massiv reduziert, zudem biete eine
          vorübergehende Entlastung beim Agrardiesel keine Planungssicherheit
          für die Landwirtschaft.
      - party: die-gruenen
        answer: zu weit
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN lehnt den <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/100/2010050.pdf">Antrag</a>
          ab. Auch wenn die Abschaffung der Agrardieselbeihilfe die
          Landwirtschaft stark belastet habe, sei bereits an<a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20147.pdf#P.18609"> anderer
          Stelle ein guter Kompromiss</a> gefunden worden, um Belastungen der
          Landwirtschaft abzufangen.
      - party: bsw
        answer: /
        comment: >-
          Die Gruppe BSW lehnt den <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/100/2010050.pdf">Antrag</a>
          ab. Eine Begründung für diese Entscheidung liegt nicht vor. Darum gilt
          die Positionierung der Gruppe BSW in Bezug auf Agrardiesel als nicht
          bewertbar.
      - party: die-linke
        answer: zu weit
        comment: >-
          Die Gruppe Die Linke lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/100/2010050.pdf">Antrag</a>
          ab, da sie die Agrardieselsubventionen für umweltschädlich und nicht
          im Einklang mit einer nachhaltigen Agrarpolitik betrachtete, so die
          Fraktion in einem <a target="_blank" rel="noopener noreferrer"
          href="https://www.die-linke.de/start/nachrichten/detail/bahnreform-20-statt-bahnsinn-und-profite-die-linke-will-die-bahn-wieder-verlaesslich-und-bezahlbar-machen/">Positionspapier</a>.
          Sie plädierte für eine ökologische Agrarwende.
      - party: afd
        answer: /
        comment: >-
          Die AfD-Fraktion enthält sich bei der Abstimmung zum <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/100/2010050.pdf">Antrag</a>.
          Grundsätzlich befürwortet die AfD die Subventionierung von
          Agrardiesel, hatte aber selbst einen <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/100/2010055.pdf">eigenen
          Antrag</a> zur Steuerbegünstigung von Agrardiesel eingebracht, der von
          der Unionsfraktion abgelehnt wurde. Darum gilt die Positionierung der
          AfD in Bezug auf Agrardiesel als nicht bewertbar.
