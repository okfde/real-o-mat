title: Bundestagswahl 2025
slug: btw25
date: '2025-02-23'
archived: true
questions:
  - id: question-0
    index: 0
    category: Arbeit
    thesis: >-
      Bürgergeldempfänger*innen, die wiederholt eine existenzsichernde Arbeit
      ablehnen, soll für zwei Monate der komplette Regelsatz des Bürgergelds
      gestrichen werden.
    answers:
      - party: spd
        answer: richtig
        comment: >-
          Die SPD-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/099/2009999.pdf">Gesetzentwurf</a>
          zu. Mit den Sanktionen beim Bürgergeld solle auch der <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/101/2010150.pdf">Bundeshaushalt
          entlastet werden</a>. Die Maßnahme solle aber zunächst auf zwei Jahre
          befristet und dann ihre Wirkung geprüft werden. Die SPD betont, dass
          es zwar nur wenige Menschen gäbe, die sich einer zumutbaren Arbeit
          komplett verweigern, an dieser Stelle zu handeln sei jedoch eine <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20146.pdf#P.18570">Frage der
          Gerechtigkeit</a>.
      - party: cdu-csu
        answer: nicht weit genug
        comment: >-
          Die Unionsfraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/099/2009999.pdf">Gesetzentwurf</a>
          ab. Zwar gehe die <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20146.pdf#P.18568">Kehrtwende
          beim Bürgergeld in die richtige Richtung</a>, das Bürgergeld müsse
          jedoch komplett neu aufgestellt und das Lohnabstandsgebot
          wiederhergestellt werden.
      - party: fdp
        answer: richtig
        comment: >-
          Die FPD-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/099/2009999.pdf">Gesetzentwurf</a>
          zu. Mit den Sanktionen beim Bürgergeld solle auch der <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/101/2010150.pdf">Bundeshaushalt
          entlastet werden</a>. Die Maßnahme solle aber zunächst auf zwei Jahre
          befristet und dann ihre Wirkung geprüft werden.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN stimmt dem <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/099/2009999.pdf">Gesetzentwurf</a>
          zu. Mit den Sanktionen beim Bürgergeld solle auch der <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/101/2010150.pdf">Bundeshaushalt
          entlastet werden</a>. Die Maßnahme solle aber zunächst auf zwei Jahre
          befristet und dann ihre Wirkung geprüft werden.
      - party: bsw
        answer: /
        comment: >-
          Die Gruppe BSW lehnt den <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/099/2009999.pdf">Gesetzentwurf</a>
          ab, hat sich jedoch in Bezug auf die Abstimmung nicht öffentlich zu
          den Bürgergeld-Sanktionen positioniert. Darum gilt die Positionierung
          der Gruppe BSW als nicht bewertbar.
      - party: die-linke
        answer: zu weit
        comment: >-
          Die Gruppe Die Linke lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/099/2009999.pdf">Gesetzentwurf</a>
          ab. Sie betont <a target="_blank" rel="noopener noreferrer"
          href="https://www.die-linke.de/start/presse/detail/buergergeld-verfassungsbruch-mit-ansage">in
          einem entsprechenden Statement</a>, dass die Ampel nicht Erwerbslose,
          sondern „lieber reiche Steuerhinterzieher“ entschieden sanktionieren
          solle.
      - party: afd
        answer: nicht weit genug
        comment: >-
          Die AfD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/099/2009999.pdf">Gesetzentwurf</a>
          ab. Die Maßnahmen beim Bürgergeld gingen zwar in die richtige
          Richtung, lösten aber das Kernproblem des inzwischen vielfach nicht
          mehr vorhandenen Lohnabstandsgebots nicht und würden daher auch <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/099/2009999.pdf">keine
          durchschlagende Entlastung</a> bringen.
  - id: question-1
    index: 1
    category: Arbeit
    thesis: >-
      Bei der Einwanderung von Fachkräften ohne EU-Staatsbürgerschaft sollen
      einige Hürden abgebaut werden.
    answers:
      - party: spd
        answer: richtig
        comment: >-
          Die SPD-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/065/2006500.pdf">Gesetzentwurf
          </a>zu. Für die SPD ist das Vorhaben<a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/073/2007394.pdf"> einer der
          wichtigen Bausteine</a>, um das sogenannte Erwerbspersonenpotenzial zu
          erhöhen, was durch den demographischen Wandel in Deutschland dringend
          notwendig ist.
      - party: cdu-csu
        answer: zu weit
        comment: >-
          Die Unionsfraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/065/2006500.pdf">Gesetzentwurf</a>
          ab. Der Fraktion geht das Gesetz zu weit. Sie fürchtet, dass es
          Anreize für den Missbrauch setze und der Eindruck entstünde, „<a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/073/2007394.pdf">nur nach
          Deutschland kommen zu müssen und mit einem Jobangebot eine
          Bleibeperspektive zu erhalten“</a>.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/065/2006500.pdf">Gesetzentwurf</a>
          zu und <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/073/2007394.pdf">begrüßt ihn
          als wichtigen Schritt</a> hin zu einer zukunftsorientierten
          Migrationspolitik, die den Arbeitsmarkt bereichern werde und
          Deutschland auf dem internationalen Arbeitsmarkt wettbewerbsfähig
          mache.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN stimmt dem, <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/065/2006500.pdf">Gesetzentwurf</a>
          zu. Es sei eine <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/073/2007394.pdf">Bekenntnis</a>
          gegen eine restriktive Migrationspolitik und erkenne an, dass
          Deutschland in der internationalen Konkurrenz um Fachkräfte ein
          attraktives Einwanderungsland sein müsse. Sie <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/073/2007394.pdf">begrüßt</a>
          ausdrücklich die Möglichkeit des Spurwechsels von Asylanspruch zu
          Arbeitstitel.
      - party: bsw
        answer: /
        comment: >-
          Die Gruppe BSW war zu diesem Zeitpunkt noch nicht im Deutschen
          Bundestag vertreten.
      - party: die-linke
        answer: nicht weit genug
        comment: >-
          Die Fraktion Die Linke enthält sich bei der Abstimmung des <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/065/2006500.pdf">Gesetzentwurfs</a>.
          Sie begrüßt den Abbau von Hürden für Migrant*innen, die in Deutschland
          leben und arbeiten wollen, <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/073/2007394.pdf">kritisiert
          allerdings</a> die Ausrichtung des Gesetzes an Wirtschaftsinteressen
          statt an den Rechten von Migrant*innen, gerade beim Familiennachzug.
          Zudem fehle eine Schutzklausel bei Verlust des Arbeitstitels, was zu
          Konsequenzen für die Aufenthaltsberechtigung und die soziale
          Absicherung von Betroffenen führen könne. Darum wird die Enthaltung
          als „nicht weit genug&quot; gewertet.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/065/2006500.pdf">Gesetzentwurf</a>
          ab. Statt Fachkräfteeinwanderung zu erleichtern, <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/073/2007394.pdf">sollten
          inländische Potenziale erschlossen werden</a>, etwa mit einer
          Optimierung des Bildungssystems oder einem stärkeren Fokus darauf,
          Arbeitslose in Arbeit zu nehmen.
  - id: question-2
    index: 2
    category: Arbeit
    thesis: Der gesetzliche Mindestlohn soll mindestens 12 Euro betragen.
    answers:
      - party: spd
        answer: richtig
        comment: >-
          Die SPD-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/014/2001408.pdf">Gesetzentwurf</a>
          zu. Sie sieht den Mindestlohn als Erfolgsmodell und betont, dass mit
          der unteren Lohngrenze der <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/019/2001916.pdf">Dumpingwettbewerb
          um Niedriglöhne</a> verhindert werde.
      - party: cdu-csu
        answer: zu weit
        comment: >-
          Die Unionsfraktion enthält sich bei der Abstimmung zum <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/014/2001408.pdf">Gesetzentwurf</a>.
          Sie stellt ausdrücklich nicht den Bruttostundenlohn von 12 Euro
          infrage, <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/019/2001916.pdf">kritisiert</a>
          aber die Festlegung des Mindestlohns durch die Politik statt durch
          Tarifpartner wie Gewerkschaften und Arbeitgeberverbände.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/014/2001408.pdf">Gesetzentwurf</a>
          zu. Sie betont jedoch, dass dies auf Wunsch der Koalitionspartner
          geschehe, denn sie halte diesen Schritt für den <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/019/2001916.pdf">schwerwiegendsten
          Eingriff in die Tarifautonomie in der bundesdeutschen Geschichte</a>.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN stimmt dem <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/014/2001408.pdf">Gesetzentwurf</a>
          zu. Die Einführung<a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/019/2001916.pdf"> des
          Mindestlohns </a>habe zu mehr Arbeitsplätzen und mehr Gerechtigkeit
          geführt, „Horrorszenarien“ über den Verlust hunderttausender
          Arbeitsplätze wegen des Mindestlohns hätten sich nicht erfüllt.
          Allerdings habe sich gezeigt, dass der Mindestlohn nicht schnell genug
          gestiegen sei. Die jetzige Anpassung sei daher richtig und notwendig.
      - party: bsw
        answer: /
        comment: >-
          Die Gruppe BSW war zu diesem Zeitpunkt noch nicht im Deutschen
          Bundestag vertreten.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Fraktion Die Linke stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/014/2001408.pdf">Gesetzentwurf</a>
          zu. Die Fraktion <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/019/2001916.pdf">kritisiert
          aber weiterhin bestehende Ausnahmen und Schlupflöcher</a>, wie
          fehlende verpflichtende Arbeitszeiterfassung durch Arbeitgeber.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD-Fraktion enthält sich bei der Abstimmung zum <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/014/2001408.pdf">Gesetzentwurf</a>.
          Sie hält die Anhebung des MIndestlohns für einen risikoreichen
          Eingriff in den Arbeitsmarkt, den sie <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/019/2001916.pdf">ablehnt</a>,
          und prognostiziert bis zu 200.000 verlorene Arbeitsplätze durch die
          Entscheidung.
  - id: question-3
    index: 3
    category: Soziales
    thesis: >-
      Schwangere, die sich zu einem Schwangerschaftsabbruch beraten lassen
      möchten, sollen besser vor Gehsteigbelästigung geschützt werden.
    answers:
      - party: spd
        answer: richtig
        comment: >-
          Die SPD-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/108/2010861.pdf">Gesetzentwurf
          </a>zu. Er sei eine <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/121/2012151.pdf">wirkliche
          Verbesserung für eine wirksame Handhabe</a> gegen
          Gehsteigbelästigungen.
      - party: cdu-csu
        answer: zu weit
        comment: >-
          Die Unionsfraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/108/2010861.pdf">Gesetzentwurf
          </a>ab. Zwar teile sie das Ziel des freien Zugangs zu Ärzt*innen und
          Beratungsstellen für Schwangere, <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/121/2012151.pdf">kritisiert
          aber,</a> dass es in Deutschland keine nennenswerten
          Gehsteigbelästigungen gebe und das Gesetz somit einer Scheindebatte
          folge. Bestehende andere rechtliche Mittel wie das Versammlungsgebot
          seien wirksam genug, um der Problematik zu begegnen.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/108/2010861.pdf">Gesetzentwurf</a>
          zu. Belästigungen von Schwangeren, die sich zu einer Abtreibung
          beraten lassen oder entscheiden, seien nicht nur <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/121/2012151.pdf">unmoralisch
          und verwerflich</a>, sondern würden auch Frauen in ihren Grundrechten
          und Grundfreiheiten verletzen.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN stimmt dem <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/108/2010861.pdf">Gesetzentwurf
          </a>zu. Er sei ein <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/121/2012151.pdf">wichtiger
          Schritt zum Schutz der reproduktiven Rechte</a> von Frauen und des
          Personals von Kliniken und Beratungsstellen und stelle sicher, dass
          die Entscheidungsfähigkeit und das Recht auf körperliche
          Selbstbestimmung von Schwangeren geschützt wird.
      - party: bsw
        answer: /
        comment: >-
          Die Gruppe BSW war in den Sitzungen, auch zur Abstimmung, größtenteils
          abwesend und hat sich nicht zum Thema geäußert. Darum gilt die
          Positionierung der Gruppe BSW als nicht bewertbar.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Gruppe Die Linke stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/108/2010861.pdf">Gesetzentwurf</a>
          zu. Es stelle nicht nur das Angebot an Beratungsstellen, sondern auch
          das <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/121/2012151.pdf">Recht auf
          sicheren Zugang</a> zu ihnen sicher. Sie betont jedoch, dass dies
          nicht die notwendige Entkriminalisierung von Schwangerschaftsabbrüchen
          ersetze.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/108/2010861.pdf">Gesetzentwurf</a>
          ab. Das Ziel des Gesetzes sei, Abtreibungen vorantreiben und dabei <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/121/2012151.pdf">Konfrontation
          mit abweichenden religiösen Vorstellungen</a> oder Meinungen zu
          vermeiden, was die Partei ablehne.
  - id: question-4
    index: 4
    category: Gesundheit
    thesis: >-
      Der Konsum und Besitz von Cannabis soll in Deutschland unter bestimmten
      Voraussetzungen erlaubt sein.
    answers:
      - party: spd
        answer: richtig
        comment: >-
          Die SPD-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/087/2008704.pdf">Gesetzentwurf</a>
          zu. Das Cannabisgesetz sei der Beginn einer <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/104/2010426.pdf">modernen,
          vernünftigen und neu ausgerichteten Drogen- und Suchtpolitik</a> und
          trage zur Entkriminalisierung bei.
      - party: cdu-csu
        answer: zu weit
        comment: >-
          Die Unionsfraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/087/2008704.pdf">Gesetzentwurf</a>
          ab. Cannabis sei eine<a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/104/2010426.pdf">
          Einstiegsdroge mit schwerwiegenden Folgen</a>, die insbesondere bei
          Jugendlichen gravierende Auswirkungen hätte.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/087/2008704.pdf">Gesetzentwurf</a>
          zu. Die teilweise Entkriminalisierung sei der Beginn einer <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/104/2010426.pdf">modernen
          Cannabispolitik</a>, die auch Strafverfolgungsbehörden entlastet
          würden. Auch stärke man so Prävention, Beratung und Therapie und
          stelle den Gesundheits-, Jugend- und Verbraucherschutz in den Fokus.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN stimmt dem <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/087/2008704.pdf">Gesetzentwurf</a>
          zu. Er sorge dafür, den Konsum von verunreinigten <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/104/2010426.pdf">Schwarzmarktprodukten
          zurückzudrängen</a> und ermögliche es, legal an gut deklariertes
          Cannabis zu kommen.
      - party: bsw
        answer: richtig
        comment: >-
          Die Gruppe BSW stimmt dem <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/087/2008704.pdf">Gesetzentwurf</a>
          zu. Man trete für einen vernünftigen, <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/104/2010426.pdf">menschenrechts-
          und gesundheitsorientierten Umgang</a> mit Drogen ein und unterstütze
          darum die Entkriminalisierung.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Gruppe Die Linke stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/087/2008704.pdf">Gesetzentwurf</a>
          zu. Er stelle zwar nur eine Entkriminalisierung, und keine
          Cannabis-Legalisierung dar, sei aber<a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/104/2010426.pdf"> ein erster
          Schritt</a> in die richtige Richtung.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/087/2008704.pdf">Gesetzentwurf
          </a>ab, denn er <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/104/2010426.pdf">diene nicht
          dem Gesundheits- bzw. Jugendschutz</a>. Sie nimmt an, dass der
          Cannabis-Konsum ansteigen würde, privaten Anbaumöglichkeiten
          allerdings erst viel später greifen und so auch der Schwarzmarkt
          wachsen würde.
  - id: question-5
    index: 5
    category: Gesundheit
    thesis: >-
      Eine temporäre Impfpflicht für Beschäftigte in Alten- und Pflegeheimen
      soll die Corona-Pandemie eindämmen.
    answers:
      - party: spd
        answer: richtig
        comment: >-
          Die SPD-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/001/2000188.pdf">Gesetzentwurf</a>
          zu. Die einrichtungsbezogene Impfpflicht sei notwendig, um in dieser
          Notlage vor allem <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/002/2000250.pdf">chronisch
          kranke oder pflegebedürftige Menschen</a> besser vor der Gefahr einer
          schweren COVID-19-Erkrankung zu schützen.
      - party: cdu-csu
        answer: richtig
        comment: >-
          Die Unionsfraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/001/2000188.pdf">Gesetzentwurf</a>
          zu, betonte aber, dass vor allem eine weitergehende,<a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/002/2000250.pdf"> allgemeine
          Impfpflicht</a> der Weg aus der Pandemie sein könne.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/001/2000188.pdf">Gesetzentwurf</a>
          zu. Die Impfpflicht in Pflegeeinrichtungen diene vor allem dem Schutz
          vulnerabler Gruppen, das Gesetz würde insgesamt <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/002/2000250.pdf">angemessen
          auf die Herausforderungen</a> der Corona-Pandemie reagieren.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN stimmt dem <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/001/2000188.pdf">Gesetzentwurf</a>
          zu. Die einrichtungsbezogene Impfpflicht <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/002/2000250.pdf">verbessere
          gezielt den Schutz der vulnerabler Gruppen</a> und stehe somit
          verfassungsrechtlich in einem anderen Kontext als beispielsweise eine
          allgemeine Impfpflicht.
      - party: bsw
        answer: /
        comment: >-
          Die Gruppe BSW war zu diesem Zeitpunkt noch nicht im Deutschen
          Bundestag vertreten.
      - party: die-linke
        answer: nicht weit genug
        comment: >-
          Die Fraktion Die Linke enthält sich bei der Abstimmung zum <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/001/2000188.pdf">Gesetzentwurf</a>.
          Als größter Kritikpunkt betont sie das <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20007.pdf#P.295">Fehlen
          einer zusätzlichen Prämie für Pflegekräfte</a>. Zudem halte es Die
          Linke für richtig, vulnerable Gruppen zu schützen, wolle die
          Verantwortung dafür aber nicht allein den Pflegekräften aufbürden. Es
          müssten möglichst viele Menschen geimpft werden.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/001/2000188.pdf">Gesetzentwurf
          </a>ab. Der Nutzen genauso wie die Nebenwirkungen der Impfungen seien
          <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/002/2000250.pdf">bisher zu
          wenig erforscht</a>, stattdessen solle vielmehr auf Medikamente zur
          Behandlung von Corona-Infektionen gesetzt werden.
  - id: question-6
    index: 6
    category: Gesundheit
    thesis: >-
      Menschen sollen ohne psychologisches Gutachten ihren Geschlechtseintrag
      und Vornamen beim Standesamt ändern dürfen.
    answers:
      - party: spd
        answer: richtig
        comment: >-
          Die SPD-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/090/2009049.pdf">Gesetzentwurf</a>
          zu. Er vereinfache den Namens- und Geschlechtseintrag für trans,
          inter- und nichtbinäre Personen zu einem <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/110/2011004.pdf">Verwaltungsakt
          ohne erniedrigende Verfahren</a> und Zwangsbegutachtungen und schaffe
          das verfassungswidrige Transsexuellengesetz ab.
      - party: cdu-csu
        answer: zu weit
        comment: >-
          Die Unionsfraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/090/2009049.pdf">Gesetzentwurf
          </a>ab. Es sei falsch, den rechtlichen <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/110/2011004.pdf">Geschlechtswechsel
          ohne Voraussetzungen</a> festzuschreiben. Außerdem genüge der
          Gesetzentwurf nicht dem Kinder- und Jugendschutz.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/090/2009049.pdf">Gesetzentwurf
          </a>zu. Er sei notwendig, um die <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/110/2011004.pdf">Rechte von
          trans-, intergeschlechtlichen und nichtbinären Menschen</a> zu
          respektieren und das verfassungswidrige Transsexuellengesetz zu
          ersetzen.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN stimmt dem <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/090/2009049.pdf">Gesetzentwurf
          </a>zu. Das Gesetz habe breiten <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/110/2011004.pdf">gesellschaftlichen
          Rückhalt</a> und Deutschland schließe sich damit vielen anderen
          Ländern in Europa und international an.
      - party: bsw
        answer: zu weit
        comment: >-
          Das BSW lehnt den <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/090/2009049.pdf">Gesetzentwurf
          </a>ab. Das Selbstbestimmungsgesetz sei ideologiegetrieben, <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20164.pdf#BM63">gefährlich
          und frauenfeindlich</a>. Stattdessen fordert das Bündnis eine
          behutsame Reform der bestehenden Gesetzeslage.
      - party: die-linke
        answer: richtig
        comment: >-
          Die Gruppe Die Linke stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/090/2009049.pdf">Gesetzentwurf
          </a>zu. Er sei  wichtiges <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/110/2011004.pdf">Signal für
          die Menschenrechte aller Menschen</a>, auch wenn es noch weiteren
          Schutz der Grundrechte von trans-, intergeschlechtlichen und
          nichtbinären Menschen benötigt.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD-Fraktion stimmt gegen den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/090/2009049.pdf">Gesetzentwurf
          </a>und bezeichnet das Selbstbestimmungsgesetz als<a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/110/2011004.pdf">
          ideologiegetrieben und die Biologie leugnend</a>. Sie fürchte auch die
          Einführung einer willkürlichen Möglichkeit der Geschlechtsänderung für
          Jugendliche, ohne ausreichende Beratung.
  - id: question-7
    index: 7
    category: Innere Sicherheit
    thesis: >-
      Zur besseren Bekämpfung von schweren Verbrechen sollen IP-Adressen länger,
      nämlich für 3 Monate, gespeichert werden.
    answers:
      - party: spd
        answer: zu weit
        comment: >-
          Die SPD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/133/2013366.pdf">Gesetzentwurf</a>
          ab. Sie spricht sich generell für die Speicherung von IP-Adressen zur
          Strafverfolgung aus, fürchtet jedoch, mit dem Gesetzentwurf der Union
          eine neue Klage vor dem EuGH zu riskieren und plädiert darum für eine
          <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20203.pdf#P.26153">rechtskonforme
          und gerichtsfeste</a> Lösung.
      - party: cdu-csu
        answer: richtig
        comment: >-
          Die Unionsfraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/133/2013366.pdf">Gesetzentwurf</a>
          zu. Deutschland habe seit dem Urteil des EuGH von 2022 <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20203.pdf#P.26139">keine
          Rechtsgrundlage</a> für die Speicherung von IP-Adressen geschaffen,
          was die Verfolgung von rund 40.000 spezifischen Verfahren verhindert
          habe. Sie fordert eine gesetzlich verankerte Mindestspeicherung von
          IP-Adressen, um Täter*innen zu identifizieren, da ansonsten eine
          systematische Straflosigkeit drohe.
      - party: fdp
        answer: zu weit
        comment: >-
          Die FDP-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/133/2013366.pdf">Gesetzentwurf
          </a>ab. Eine voreiligen Einführung der dreimonatigen
          Vorratsdatenspeicherung sei ein Eingriff in die Rechte unschuldiger
          Bürger*innen, nur in eng begrenzten Fällen zulässig und nicht
          ausreichend begründet. Stattdessen müsse der Zugriff auf IP-Adressen
          <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20203.pdf#P.26142">rechtssicher
          und europarechtskonform gestaltet werden</a>.
      - party: die-gruenen
        answer: zu weit
        comment: >-
          Die Fraktion BÜNDNIS 90/DIE GRÜNEN lehnt den <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btd/20/133/2013366.pdf">Gesetzentwurf</a>
          ab. Es brauche in der Debatte eine <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btp/20/20203.pdf#P.26146">Differenzierung
          und Abwägung mit anderen Rechtsgütern</a>, die bei der geforderten
          Vorratsdatenspeicherung nicht vorliegt. Das Gesetz würde viele
          Unschuldige und auch Kinder zum Ziel von Strafverfolgungsbehörden
          machen.
      - party: bsw
        answer: /
        comment: >-
          Die Gruppe BSW war zur Debatte, sowie zur Abstimmung abwesend und hat
          sich nicht zu dem Antrag geäußert. Darum gilt die Positionierung der
          Gruppe BSW als nicht bewertbar.
      - party: die-linke
        answer: zu weit
        comment: >-
          Die Gruppe Die Linke lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/133/2013366.pdf">Gesetzentwurf
          </a>ab. Sie kritisiert, dass der Vorschlag gegen die Vorgaben des EuGH
          und das Grundgesetz verstoße. <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btp/20/20203.pdf#P.26155">Demokratie
          und Massenüberwachung</a> seien unvereinbar. Zudem sei die Maßnahme
          ungeeignet, da Kriminelle IP-Adressen verschleiern könnten.
      - party: afd
        answer: zu weit
        comment: >-
          Die AfD-Fraktion lehnt den <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/133/2013366.pdf">Gesetzentwurf
          </a>ab. Sie wirft der Union vor, die Strafverfolgung als <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20203.pdf#P.26146">Vorwand
          für die Schaffung eines „Überwachungsstaates“</a> zu nutzen. Sie
          bezeichnet die Vorschläge als dystopisch.
  - id: question-8
    index: 8
    category: Inneres
    thesis: >-
      Organisationen oder Projekte, die das Existenzrecht Israels in Frage
      stellen, sollen in Deutschland keine staatliche finanzielle Förderung
      erhalten.
    answers:
      - party: spd
        answer: richtig
        comment: >-
          Die SPD-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/136/2013627.pdf">Antrag</a>
          zu. Sie erklärt zugleich,  Sorgen zur Einschränkung der Kunst- und
          Meinungsfreiheit ernst zu nehmen. Die Fraktion bekräftigt in der
          Plenardebatte, dass „<a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20197.pdf#P.25728">kein
          Antisemitismus mit staatlichen Geldern gefördert werden&quot; dürfe,
          jeder Einzelfall sei dabei „sehr sorgfältig&quot;</a> zu prüfen.
      - party: cdu-csu
        answer: richtig
        comment: >-
          Die Unionsfraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/136/2013627.pdf">Antrag</a>
          zu. Jegliche Kritik an einer möglichen Einschränkung der Meinungs- und
          Kunstfreiheit durch die Bekräftigung der IHRA-Definition  sei &quot;<a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20197.pdf#P.25723">eine
          bösartige Unterstellung</a>&quot;.
      - party: fdp
        answer: richtig
        comment: >-
          Die FDP-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/136/2013627.pdf">Antrag</a>
          zu. Eine Auseinandersetzung über Antisemitismus in Deutschland könne
          nicht vom Bekenntnis zum Existenzrecht Israels getrennt <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20197.pdf#P.25717">werden</a>.
          Eine Trennung zwischen Israel und dem Leben von Jüd*innen in
          Deutschland sei „<a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20197.pdf#P.25717">künstlich“
          und „nicht möglich“</a>.
      - party: die-gruenen
        answer: richtig
        comment: >-
          Die Fraktion der Grünen stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://www.bundestag.de/dokumente/textarchiv/2024/kw45-de-juedisches-leben-1027708">Antrag</a>
          zu. Der heutige Antisemitimus habe eine <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20197.pdf#P.25711">enorme
          Bandbreite</a>, von ganz links nach ganz rechts und auch in der Mitte
          der Gesellschaft. Der Antrag benenne auch Antisemitimus, „<a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20197.pdf#P.25714">der auf
          Zuwanderung aus Ländern beruht, in denen Antisemitismus und
          Israelfeindlichkeit aufgrund islamistischer und antiisraelischer
          staatlicher Indoktrination verbreitet sind</a>.“
      - party: bsw
        answer: zu weit
        comment: >-
          Die Gruppe BSW lehnt den <a target="_blank" rel="noopener noreferrer"
          href="https://www.bundestag.de/dokumente/textarchiv/2024/kw45-de-juedisches-leben-1027708">Antrag</a>
          ab. Die Bekräftigung der IHRA-Definition von Antisemitimus sei ein „<a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20197.pdf#P.25729">Angriff
          auf die Freiheit der Wissenschaft, Kunst und Kultur, auf Grundrechte
          und Völkerrecht.</a>&quot; Sie kritisiert, der Antrag <a
          target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20197.pdf#P.25725">isoliere
          Deutschland international</a>, auch angesichts der laufenden
          Untersuchungen gegen Israel für Völkerstraftaten und Kriegsverbrechen.
      - party: die-linke
        answer: zu weit
        comment: >-
          Die Gruppe Die Linke enthält sich bei der Abstimmung zum <a
          target="_blank" rel="noopener noreferrer"
          href="https://www.bundestag.de/dokumente/textarchiv/2024/kw45-de-juedisches-leben-1027708">Antrag</a>.
          Sie betont, dass es ein sicheres Israel es <a target="_blank"
          rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20197.pdf#P.25725">nur mit
          einem souveränen und sicheren Palästina gebe</a>. Die Resolution
          schütze unterschiedliches jüdisches Leben in Deutschland nicht, und
          eröffne Möglichkeiten zur <a target="_blank" rel="noopener noreferrer"
          href="https://dserver.bundestag.de/btp/20/20197.pdf#P.25725">Einschränkung
          der Kunst-, Wissenschafts- und Meinungsfreiheit</a>.
      - party: afd
        answer: richtig
        comment: >-
          Die AfD-Fraktion stimmt dem <a target="_blank" rel="noopener
          noreferrer"
          href="https://dserver.bundestag.de/btd/20/136/2013627.pdf">Antrag</a>
          zu. Sie wirft der Bundesregierung und einzelnen Bundestagsmitgliedern
          Deutsch- und Israelfeindlichkeit vor und verweist vor allem auf den
          vermeintichen Antisemitismus von Muslim*innen in Deutschland.
  - id: question-9
    index: 9
    category: Verteidigung
    thesis: >-
