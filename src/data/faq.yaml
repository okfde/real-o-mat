- id: 0
  question: 'Wie wurden die Themen für den *Real-o-Mat* ausgewählt?'
  answer: |
    Der Real-O-Mat fragt Positionen zu 14 politischen Forderungen aus der vergangenen Legislaturperiode in Berlin bzw. Sachsen-Anhalt ab. Die Thesen des Real-O-Mat wurden aus Gesetzentwürfen und Anträgen abgeleitet, über die in der letzten Legislaturperiode von 2021 bzw. 2023 bis Juli 2026 im jeweiligen Landesparlament abgestimmt wurde. Diese Auswahl ist nicht vollständig, sondern bildet nur einen Teil der im jeweiligen Bundesland diskutierten Themen ab.

    Dabei wurden Themen ausgewählt, die für breite Teile der Bevölkerung im jeweiligen Bundesland relevant sind und öffentlich breit diskutiert wurden. So ist davon auszugehen, dass ein großer Teil der Nutzer*innen mit den Themen vertraut ist und eine Position zu den ausgewählten Themen hat. Dafür haben wir bspw. auch zivilgesellschaftliche Akteure vor Ort kontaktiert. 

    Darüber hinaus spielte die Datenlage eine wichtige Rolle: Nur Themen, zu denen es a) entsprechende Anträge oder Gesetzentwürfe, über die im Landesparlament abgestimmt wurde und b) ausreichend inhaltliche Positionierung der Fraktionen, etwa in Plenarprotokollen gibt, konnten einbezogen werden.

- id: 1
  question: Warum sind einige Parteien im *Real-o-Mat* nicht vertreten?
  answer: |
    Der Real-O-Mat informiert über das tatsächliche Abstimmungsverhalten der Fraktionen. Da bspw. die FDP seit der Neuwahl 2023 im aktuellen Abgeordnetenhaus in Berlin nicht vertreten ist, taucht diese Partei in der Auswertung für Berlin nicht auf. 


- id: 2
  question: Warum erhalte ich bei einigen Parteien ein sehr ähnliches Ergebnis?
  answer: |
    Das Abstimmungsergebnis bei einigen Parteien ist oft ähnlich, weil diese Parteien sich als Teil einer gemeinsamen Koalition oft auf Kompromisse geeinigt und gemeinsam abgestimmt haben. Dies ist nicht ungewöhnlich für Koalitionsregierungen in Deutschland. Dadurch weicht das Abstimmungsverhalten auch von den Wahlversprechen ab – genau dies kann der Real-O-Mat sichtbar machen.

    Im Real-O-Mat sind darum zu allen Abstimmungen auch – soweit vorhanden – die Begründungen der Parteien einsehbar. Hier wird deutlich, dass auch die Parteien einer Regierungskoalition teilweise unterschiedliche Positionen haben, auch wenn sie gemeinsam abgestimmt haben. Wir empfehlen darum, dass sich Nutzer*innen auch die Begründungen zum Abstimmungsverhalten durchlesen.

- id: 3
  question: Wie unterscheiden sich der *Real-O-Mat* und der *Wahl-O-Mat*?
  answer: |
    Während der Wahl-O-Mat lediglich auf Aussagen der Parteien basiert, wertet der Real-O-Mat das tatsächliche Abstimmungsverhalten der Fraktionen aus, die in der letzten Legislaturperiode im jeweiligen Landesparlament vertreten waren. Darüber hinaus liefert er die im parlamentarischen Verfahren bzw. in Debatten genannten Begründungen für das Abstimmungsverhalten der Fraktionen.

    Der Real-O-Mat bezieht sich auf Abstimmungen zu Anträgen und Gesetzentwürfen im jeweiligen Landesparlament, die Begründungen wurden aus Plenardebatten und Beschlussempfehlungen herausgearbeitet. Die Datenbasis bilden die verfügbaren Dokumente des [Landtags Sachsen-Anhalt](https://www.landtag.sachsen-anhalt.de/dokumente/neue-doku) bzw. des [Berliner Abgeordnetenhauses](https://www.parlament-berlin.de/dokumente). Sie sind im Real-O-Mat als Belege zu den Aussagen verlinkt.


- id: 4
  question: Warum bildet der *Real-O-Mat* nicht die fraktionslosen Abgeordneten im Landesparlament ab?

  answer: |
    Der Real-O-Mat gibt Auskunft über das Abstimmungsverhalten der Fraktionen. Fraktionslose Abgeordnete bildet der Real-O-Mat nicht ab. Die Gruppe der fraktionslosen Abgeordneten zusammengefasst abzubilden, wäre nicht repräsentativ oder methodisch korrekt, da diese Abgeordneten keine gemeinsamen Abstimmungen treffen.

    Auf der Website von Abgeordnetenwatch kannst du das Abstimmungsverhalten aller einzelnen Abgeordneten – auch der fraktionslosen – zu allen namentlichen Abstimmungen einsehen.

- id: 5
  question: Warum gibt es keinen *Real-O-Mat* zu Mecklenburg-Vorpommern?
  answer: |
    Der Real-O-Mat basiert auf umfassenden parlamentarischen Dokumenten des jeweiligen Bundeslandes. Voraussetzung dafür ist nicht nur eine umfassende, sondern auch eine leicht zugängliche Dokumentation der jeweiligen Anträge, Abstimmungen und Plenardebatten.

    Für unser Team waren die Daten zu Berlin und Sachsen-Anhalt zugänglicher, da sie über die gesamte Legislaturperiode bereits niedrigschwelliger aufgearbeitet sind. Als kleines Team mussten wir uns zudem auf ausgewählte Wahlen beschränken und können aktuell den Real-O-Mat nicht zu jeder Landtagswahl gewährleisten. [Hier kannst Du Dir einen eigenen Überblick](https://www.dokumentation.landtag-mv.de/parldok) über Abstimmungen im Landtag von Mecklenburg-Vorpommern verschaffen.

- id: 6
  question: Wer steckt hinter dem *Real-O-Mat*?
  answer: |
    Der Real-O-Mat wurde von FragDenStaat mit Unterstützung eines externen Recherche- und Analyseteams erstellt.

    FragDenStaat ist eine Transparenz- und Rechercheplattform. Seit 2011 setzen wir uns für Informationsfreiheit in Deutschland ein, vor allem mithilfe des Informationsfreiheitsgesetzes (IFG). Wir ermöglichen Nutzer*innen, ihr Recht auf Information wahrzunehmen, zum Beispiel über Anfragen nach dem IFG auf unserer Plattform FragDenStaat.de. Darüber hinaus setzen wir mit investigativen Recherchen, strategischen Klagen und Community-Aktionen das Recht auf Information durch.

    FragDenStaat ist ein Projekt der gemeinnützigen Open Knowledge Foundation Deutschland e.V. und spendenfinanziert.

- id: 7
  question: Wie kann ich per Briefwahl wählen?
  answer: |
    Mit [wahlbrief.de](https://www.wahlbrief.de) stellt FragDenStaat Dir ein Tool zur Verfügung, mit dem du innerhalb von wenigen Minuten Deine Briefwahlunterlagen beantragen kannst. Per Briefwahl zu wählen ist einfach, sicher und unkompliziert. Jede wahlberechtigte Person in Deutschland kann vor der Wahl per Brief ihre Stimme abgeben, statt am Tag der Wahl in ein Wahllokal zu gehen.

    Wahlbrief hilft bei der Erstellung des Antrags auf Briefwahl, prüft auf Vollständigkeit und ermittelt die Adresse des zuständigen Amts anhand der Meldeanschrift. Der Antragstext kann dann per E-Mail ans Wahlamt des Hauptwohnsitzes gesendet werden. Auf [wahlbrief.de](https://www.wahlbrief.de) findest Du alle weiteren Infos.

